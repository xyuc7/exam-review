<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>經紀法規申論背誦本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4EF; --sheet:#FBFCF9; --ink:#1D2321; --muted:#68706B; --line:#D8DDD4;
  --blue:#23457A; --blue-soft:#E3EAF4; --mark:#FFE45C; --mark-ink:#1D2321;
  --ok:#2C7A57; --mid:#B9821A; --bad:#B23E37; --app:#5B4B8A; --app-soft:#EEEAF7;
  --fs:18px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141818; --sheet:#1B2020; --ink:#E5E9E3; --muted:#9AA39D; --line:#2E3634;
    --blue:#93B3E6; --blue-soft:#22303F; --mark:rgba(255,220,60,.32); --mark-ink:#FFF3B8;
    --ok:#5DBB8D; --mid:#E0B04E; --bad:#E57A72; --app:#B9A8EC; --app-soft:#272238;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141818; --sheet:#1B2020; --ink:#E5E9E3; --muted:#9AA39D; --line:#2E3634;
  --blue:#93B3E6; --blue-soft:#22303F; --mark:rgba(255,220,60,.32); --mark-ink:#FFF3B8;
  --ok:#5DBB8D; --mid:#E0B04E; --bad:#E57A72; --app:#B9A8EC; --app-soft:#272238;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:22px 14px 40px;background:var(--paper)}
.subj{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 6px 16px;background:var(--sheet)}
.subj button{flex:1;border:0;background:transparent;padding:8px 0;font-size:14px;color:var(--muted)}
.subj button+button{border-left:1px solid var(--line)}
.subj button[aria-selected="true"]{background:var(--blue-soft);color:var(--blue);font-weight:700}
.brand{font-family:"Noto Serif TC",serif;font-weight:800;font-size:22px;line-height:1.3;margin:0 8px 4px}
.progress{margin:0 8px 18px;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 6px 14px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.group{font-size:12px;color:var(--muted);margin:14px 8px 4px}
.topic{display:grid;grid-template-columns:28px 1fr 10px;gap:6px;align-items:start;width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:6px;font-size:14px;line-height:1.45}
.topic:hover{background:var(--sheet)}
.topic[aria-current="true"]{background:var(--blue-soft)}
.topic .no{font-family:"Noto Serif TC",serif;font-weight:600;color:var(--blue)}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;border:1.5px solid var(--line)}
.dot.bad{background:var(--bad);border-color:var(--bad)}
.dot.mid{background:var(--mid);border-color:var(--mid)}
.dot.good{background:var(--ok);border-color:var(--ok)}
.rail .tools{display:flex;gap:6px;margin:22px 8px 0;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:6px 12px;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--sheet)}

/* toolbar */
.main{min-width:0}
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:transparent;padding:7px 13px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.spacer{flex:1}
.menu-btn{display:none}
.small{font-size:13px;padding:5px 10px}
select.btn{appearance:auto}

.sheet{max-width:760px;margin:26px auto 130px;padding:0 22px}
.hint{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.6}
.qhead{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.qno{font-family:"Noto Serif TC",serif;font-weight:800;font-size:44px;line-height:1;color:var(--blue)}
.law{font-size:13px;color:var(--muted)}
h1.title{font-family:"Noto Serif TC",serif;font-weight:800;font-size:clamp(22px,3vw,28px);line-height:1.4;margin:6px 0 18px}
.question{background:var(--sheet);border-left:3px solid var(--blue);padding:14px 18px;border-radius:0 6px 6px 0;font-size:calc(var(--fs) - 2px);line-height:1.85;margin-bottom:26px}
.question p{margin:0 0 .5em}.question p:last-child{margin:0}
.question summary{cursor:pointer;color:var(--blue);font-weight:500;font-size:14px}

.answer{font-family:"Noto Serif TC","Songti TC",serif;font-size:var(--fs);line-height:2}
.ln{margin:0 0 .55em;border-radius:4px;transition:background .2s}
.ln.h{font-family:"Noto Sans TC",sans-serif;font-weight:700;color:var(--blue);font-size:1.05em;margin:1.5em 0 .5em;line-height:1.6}
.ln.h:first-child{margin-top:0}
.ln.i{display:grid;grid-template-columns:1.9em 1fr;padding-left:.2em}
.ln.s{display:grid;grid-template-columns:2.4em 1fr;padding-left:2.1em}
.lab{color:var(--blue);font-weight:600}
.kw{font-weight:700}
.ln.x{background:var(--app-soft);border-left:3px solid var(--app);padding:.5em .9em;font-size:.95em}
.ln.x::before{content:"涵攝";display:block;font-family:"Noto Sans TC",sans-serif;font-size:12px;color:var(--app);font-weight:700;line-height:1.4}
mark.n{background:linear-gradient(transparent 52%,var(--mark) 52%);color:inherit;padding:0 .08em;font-weight:600}
.ln.speaking{background:var(--blue-soft)}

/* cloze */
.blank{border:0;border-bottom:2px solid var(--blue);background:var(--blue-soft);border-radius:3px 3px 0 0;min-width:2.6em;padding:0 .2em;font:inherit;line-height:1.3;color:transparent;font-weight:600}
.blank.on{color:var(--ink);background:var(--mark);border-color:var(--mid)}
/* first-char & skeleton */
.tap{cursor:pointer}
.hid{color:transparent;text-decoration:underline dotted var(--muted);text-underline-offset:.35em;user-select:none}
.ln.open .hid{color:inherit;text-decoration:none;user-select:auto}
.fold{display:inline-block;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-size:.8em;border:1px dashed var(--line);border-radius:4px;padding:0 .6em}
.ln.open .fold{display:none}
.ln .full{display:none}
.ln.open .full{display:inline}
.ln.sk-p{padding-left:2.1em}

/* recall */
textarea{width:100%;min-height:320px;font:inherit;font-family:"Noto Serif TC",serif;font-size:var(--fs);line-height:1.9;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);resize:vertical}
.score{margin:20px 0;padding:16px 18px;background:var(--sheet);border:1px solid var(--line);border-radius:8px}
.score b{font-size:26px;font-family:"Noto Serif TC",serif;color:var(--blue)}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.key{font-size:13px;padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
.key.hit{background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:var(--ok);color:var(--ok)}
.key.miss{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}

.rate{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rate span{color:var(--muted);font-size:14px;margin-right:4px}
.rate .btn[aria-pressed="true"].bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.rate .btn[aria-pressed="true"].mid{background:var(--mid);color:#fff;border-color:var(--mid)}
.rate .btn[aria-pressed="true"].good{background:var(--ok);color:#fff;border-color:var(--ok)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.nav .btn{max-width:48%;text-align:left;line-height:1.4}

.bottombar{position:fixed;left:290px;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.bb-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bb-btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 14px;font-size:15px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.bb-btn:hover:not(:disabled){border-color:var(--muted)}
.bb-btn:disabled{opacity:.4;cursor:default}
.bb-track{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;cursor:pointer;position:relative}
.bb-fill{height:100%;background:var(--bad);border-radius:3px;transition:width .25s}
.bb-count{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:860px){.bottombar{left:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}.bb-inner{gap:8px}.bb-btn{padding:7px 10px;font-size:14px}}
.scrim{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:min(320px,86vw);height:auto;z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(env(safe-area-inset-top,0px) + 20px);box-shadow:0 0 30px rgba(0,0,0,.18)}
  .rail.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40}
  .menu-btn{display:inline-block}
  .toolbar{padding:8px 12px;gap:8px}
  .seg button{padding:6px 9px;font-size:13px}
  .sheet{padding:0 16px;margin-top:18px}
  .qno{font-size:36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail" aria-label="題目清單">
    <div class="subj" id="subj" role="tablist" aria-label="科目"></div>
    <div class="brand">經紀法規<br>申論背誦本</div>
    <div class="progress"><span id="progText"></span><div class="bar" id="progBar"></div></div>
    <div class="filters" id="filters"></div>
    <nav id="list"></nav>
    <div class="tools">
      <button class="btn" id="randBtn">抽一題沒背熟的</button>
      <button class="btn" id="themeBtn">切換深淺色</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <div class="toolbar">
      <button class="btn small menu-btn" id="menuBtn" aria-label="開啟題目清單">☰ 題目</button>
      <div class="seg" id="modes" role="group" aria-label="背誦模式"></div>
      <div class="spacer"></div>
      <button class="btn small" id="revealBtn">全部顯示</button>
      <button class="btn small" id="ttsBtn" title="朗讀答案">▶ 朗讀</button>
      <select class="btn small" id="rate" aria-label="朗讀速度">
        <option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option>
      </select>
      <button class="btn small" id="fsDown" aria-label="字變小">A−</button>
      <button class="btn small" id="fsUp" aria-label="字變大">A+</button>
    </div>
    <div class="sheet" id="sheet"></div>
    <div class="bottombar">
      <div class="bb-inner">
        <button class="bb-btn" id="bbPrev">‹ 上一題</button>
        <div class="bb-track" id="bbTrack" role="progressbar" aria-label="目前題號" aria-valuemin="1"><div class="bb-fill" id="bbFill"></div></div>
        <span class="bb-count" id="bbCount"></span>
        <button class="bb-btn" id="bbRand">🎲 抽題</button>
        <button class="bb-btn" id="bbNext">下一題 ›</button>
      </div>
    </div>
  </main>
</div>

<script>
const BOOKS = [
 {id:"jj",name:"經紀條例",laws:["全部","經紀條例","公寓大廈","消保法","公平法"],data:[{"n": 1, "title": "不動產經紀業開業程序、不得經營之情形及經紀人資格限制", "law": "經紀條例", "q": ["某甲因生涯規劃，擬投資從事不動產經紀業之經營，試問某甲申請不動產經紀業開業時，應辦理哪些程序？又如某甲具有何種情形時，不得申請經營經紀業？另甲先前已通過不動產經紀人考試，並取得不動產經紀人證書，惟嗣後主管機關查得甲曾犯詐欺罪，受有期徒刑一年以上刑之宣告確定，且刑之執行完畢尚未滿三年。試問甲得否充任不動產經紀人？其已取得之經紀人證書應如何處理？試依不動產經紀業管理條例規定說明之。"], "a": [["h", "（一）某甲經營經紀業應辦理之程序"], ["i", "1.申請許可： 經營經紀業者，應先向主管機關申請許可。"], ["i", "2.辦理公司或商業登記： 經營經紀業者，於向主管機關申請許可後，應依法辦理公司或商業登記。"], ["i", "3.繳存營業保證金： 經紀業於辦妥公司登記或商業登記後，應依中央主管機關規定繳存營業保證金。"], ["i", "4.加入同業公會： 經紀業經主管機關許可，辦妥公司登記或商業登記，繳存營業保證金，並加入登記所在地之同業公會後，始得營業。"], ["i", "5.開始營業： 經紀業應於繳存營業保證金及加入同業公會後6個月內開始營業；逾期未開始營業者，由主管機關廢止其許可。但有正當理由者，得申請展延一次，其期限以 3個月為限。"], ["h", "（二）不得申請經營經紀業之情形"], ["p", "有下列情形之一者，不得申請經營經紀業；其經許可者，撤銷或廢止其許可："], ["i", "1. 無行為能力或限制行為能力者。"], ["i", "2. 受破產之宣告尚未復權者。"], ["i", "3. 犯詐欺、背信、侵占罪、性侵害犯罪防治法、組織犯罪防制條例等罪，經受有期徒刑 1 年以上刑之宣告確定，尚未執行完畢或執行完畢或赦免後未滿3年者。但受緩刑宣告者，不在此限。"], ["i", "4. 受感訓處分之裁定確定，尚未執行完畢或執行完畢後未滿3年者。"], ["i", "5. 曾經營經紀業，經主管機關撤銷或廢止許可，自撤銷或廢止之日起未滿5年者。但逾期未開始營業或自行停止業務者，不在此限。"], ["i", "6. 受停止營業處分，尚未執行完畢者。"], ["i", "7. 受停止執行業務處分尚未執行完畢，或廢止經紀人員證書或證明處分未滿5年者。"], ["h", "（三）已考取經紀人者具有上述事由之處理"], ["p", "依規定有前述第1款至第4款或第7款情形之一者，不得充任經紀人員；已充任者，應撤銷或廢止其證書或證明。"], ["x", "本題甲雖已通過不動產經紀人考試並取得經紀人證書，但其曾犯詐欺罪，受有期徒刑1年以上刑之宣告確定，且執行完畢尚未滿3年，屬前述第3款之情形，因此不得充任經紀人員；其既已取得經紀人證書，主管機關應依法撤銷或廢止其證書。"]]}, {"n": 2, "title": "甲未經許可經營仲介業務及乙公司廣告未下架之法律責任", "law": "經紀條例", "q": ["甲未具不動產經紀人員資格，亦未依法設立經紀業，卻長期、反覆受不同屋主委託，於591租屋網站刊登廣告，並協助安排看屋、介紹屋況及聯繫租賃條件。", "甲主張自己僅係協助友人，且未收取任何報酬，不應受到處罰。另合法經營仲介業務之乙公司，因未將已成交並完成所有權移轉登記之房屋廣告下架，廣告仍顯示房屋待售，遭民眾檢舉。乙公司主張只是疏忽忘記下架，並無欺騙消費者之意圖。", "試依不動產經紀業管理條例相關規定，分析甲、乙之主張是否有理由？其行為涉及何種法律責任及處罰？"], "a": [["h", "（一）甲未經許可經營仲介業務之認定及處罰"], ["i", "1.仲介業務之認定"], ["p", "依不動產經紀業管理條例規定，所謂「仲介業務」，係指從事不動產買賣、互易、租賃之居間或代理業務。"], ["x", "本題甲多次刊登租屋廣告，並提供聯絡、安排看屋、介紹房屋狀況及居中聯繫租賃條件，具有持續經營不動產租賃居間業務之性質。仲介業務之認定並不以實際收取報酬為必要，故甲不得僅以未收取仲介費而主張其非屬經營仲介業務。"], ["i", "2.違反規定及處罰"], ["p", "甲非經紀業而經營仲介或代銷業務者，主管機關應禁止其營業，並處行為人甲新臺幣10萬元以上30萬元以下罰鍰。"], ["p", "又行為人甲經主管機關依規定為禁止營業處分後，仍繼續營業者，處一年以下有期徒刑、拘役或科或併科新臺幣10萬元以上30萬元以下罰金。"], ["h", "（二）乙公司廣告未下架之法律責任及處罰"], ["i", "1.違反規定"], ["p", "經紀業之廣告及銷售內容，應與事實相符，並註明經紀業名稱。"], ["i", "2.處罰"], ["p", "乙經紀業違反規定，由直轄市、縣（市）主管機關處新臺幣6萬元以上30萬元以下罰鍰。經紀業經處罰鍰者，主管機關並應令其限期改正；屆期未改正者，按次處罰。"], ["p", "惟依行政罰法規定，違反行政法上義務之行為非出於故意或過失者，不予處罰。乙公司雖主張無欺騙故意，仍應判斷其是否具有未及時下架廣告之過失，不得僅以忘記下架即當然免責。"], ["p", "此外，廣告及銷售內容與事實不符者，應負損害賠償責任；惟仍須有損害發生及因果關係，始生具體賠償義務。"]]}, {"n": 3, "title": "甲公司辦理成屋買賣之簽章、說明書解說交付及115年修正規定", "law": "經紀條例", "q": ["甲不動產仲介公司辦理成屋買賣時，部分交易文件由經紀營業員乙簽章，且未經委託人簽章即向買方解說不動產說明書，直到簽約後才交付買方。此外，甲公司使用之不動產說明書載有「內容僅供參考」「房價未來可望上漲」等文字，且未依115年4月1日施行之新規定更新應記載事項。試依不動產經紀業管理條例及相關規定，說明甲公司應遵守之法律規範、115 年不動產說明書修正重點及違反規定之法律效果。"], "a": [["h", "（一）應由經紀業指派經紀人簽章之文件"], ["i", "1. 不動產出租、出售委託契約書。"], ["i", "2. 不動產承租、承購要約書。"], ["i", "3. 定金收據。"], ["i", "4. 不動產廣告稿。"], ["i", "5. 不動產說明書。"], ["i", "6. 不動產租賃、買賣契約書。"], ["p", "前述第1款及第2款之規定，於經營代銷業務者不適用之。"], ["x", "就本題而言，經紀營業員之職務為協助經紀人執行仲介或代銷業務，上述文件依法應由「經紀人」簽章。甲公司辦理成屋買賣仲介，部分交易文件卻由營業員乙簽章，未由經紀人簽章，已違反上述規定。"], ["h", "（二）不動產說明書之解說與交付"], ["i", "1. 不動產說明書應由經紀業指派經紀人簽章。"], ["i", "2. 經紀人員在執行業務過程中，應以不動產說明書向與委託人交易之相對人解說。說明書於提供解說前，應經委託人簽章。"], ["i", "3. 雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由相對人在不動產說明書上簽章。前項不動產說明書視為租賃或買賣契約書之一部分。"], ["p", "其中，委託人簽章，目的在確認說明書所載標的資訊業經委託人確認。本題甲公司未經委託人簽章即向買方解說，違反解說前應經委託人簽章之規定。"], ["p", "另外，不動產說明書應於簽約「時」交付相對人並由其簽章，使買方於締約時即掌握標的資訊，並使說明書成為契約之一部分。甲公司遲至簽約後始交付，違反交付時點之規定。"], ["h", "（三）不動產說明書不得記載事項"], ["i", "1. 不得記載本說明書內容僅供參考。"], ["i", "2. 不得記載繳回不動產說明書。"], ["i", "3. 不得使用實際所有權面積以外之「受益面積」、「銷售面積」、「使用面積」等類似名詞。"], ["i", "4. 預售屋出售標的，不得記載未經依法領有建造執照之夾層設計或夾層空間面積。"], ["i", "5. 不得記載以不動產委託銷售標的現況說明書、不動產委託承購標的現況說明書、要約書標的現況說明書或建物現況確認書，替代不動產說明書之內容。"], ["i", "6. 不得記載房價有上漲空間或預測房價上漲之情形。"], ["p", "甲公司之不動產說明書載有「內容僅供參考」及「房價未來可望上漲」等文字，分別違反前述第1款及第6款規定。"], ["p", "不動產說明書既視為契約之一部分，「僅供參考」之記載不能減免甲公司依說明書內容所負之責任；預測房價上漲，則易影響買方之交易決定。"], ["h", "（四）115年不動產說明書應記載事項修正重點"], ["i", "1. 太陽光電設備：成屋及預售屋增列有無設置太陽光電發電設備，設置者並應說明其位置。"], ["i", "2. 建築能效：成屋增列建築能效情形，包括有無取得建築能效標示等資訊。"], ["i", "3. 混凝土氯離子：預售屋修正交屋時有無檢附建築物混凝土氯離子含量檢測報告之名稱。"], ["h", "（五）違反規定之法律效果"], ["i", "1.經紀業之處罰"], ["p", "甲經紀業違反指派經紀人簽章規定者，處新臺幣6萬元以上30萬元以下罰鍰，並應令其限期改正；屆期未改正者，按次處罰。"], ["i", "2.經紀人員乙之懲戒"], ["p", "經紀人員違反簽章規定，或違反解說前應經委託人簽章之規定者，應予申誡。"], ["p", "受申誡處分3次者，應另予6個月以上3年以下停止執行業務處分；受停止執行業務處分累計達5年以上者，廢止其經紀人員證書或證明。"], ["i", "3.損害賠償責任"], ["s", "（1）經紀業因經紀人員執行仲介業務之故意或過失，致交易當事人受損害者，經紀業應與經紀人員負連帶賠償責任。"], ["s", "（2）簽約後始交付說明書，以及說明書記載不得記載事項，本條例雖未另定罰則，但均屬經紀人員執行業務之疏失。買方如因此受有損害，仍得請求甲公司與經紀人員連帶賠償。"]]}, {"n": 4, "title": "營業保證金之目的、退還原因、期限、範圍及證明文件", "law": "經紀條例", "q": ["甲經營一家不動產仲介公司多年，依法繳存營業保證金。近年因房市交易量減少及經營成本增加，甲考慮結束仲介業務，或減少經紀人、裁撤部分營業處所，以降低營運成本，並希望取回已繳存之營業保證金。", "試依不動產經紀業管理條例及相關規定，說明營業保證金之目的、得請求退還之原因、期限、範圍及應檢附之證明文件。"], "a": [["h", "（一）營業保證金之目的"], ["p", "因可歸責於經紀業之事由不能履行委託契約，致委託人受損害，或經紀人員執行仲介、代銷業務因故意或過失致交易當事人受損害時，該經紀業應與經紀人員負連帶賠償責任。"], ["p", "受害人取得對經紀業或經紀人員之執行名義、經仲裁成立或基金管理委員會決議支付後，得於該經紀業繳存營業保證金及提供擔保總額內，向全國聯合會請求代為賠償，避免經紀業無力賠償而影響交易當事人權益。"], ["p", "因此，設置營業保證金制度，使受害人於符合一定法定要件後，得請求代為賠償，以保障交易安全。"], ["h", "（二）請求退還之原因"], ["i", "1. 原繳存營業保證金之退還"], ["s", "（1）公司組織申請解散者。"], ["s", "（2）商號組織申請歇業者。"], ["s", "（3）營業項目經變更登記後，該公司或商號已無不動產仲介經紀業及不動產代銷經紀業而組織仍存續者。"], ["i", "2. 溢繳營業保證金之退還"], ["p", "經紀業因減少經紀人或裁撤營業處所，致已繳存之營業保證金高於法定應繳存數額者，於符合規定條件時，得請求退還溢繳之營業保證金。"], ["h", "（三）期限"], ["i", "1. 原繳存營業保證金之退還"], ["p", "經紀業因申請解散、歇業或變更營業項目而註銷營業者，得自核准註銷營業之日滿1年後2年內，請求退還原繳存之營業保證金。"], ["i", "2. 溢繳營業保證金之退還"], ["p", "經紀業因減少經紀人或裁撤營業處所，致已繳存之營業保證金高於法定數額，經直轄市或縣（市）主管機關准予備查之日起滿2年後2年內，且無受害人請求代為賠償案件者，得請求退還溢繳之營業保證金。"], ["h", "（四）範圍"], ["i", "1. 原繳存營業保證金之退還"], ["p", "經紀業得請求退還原繳存之營業保證金，但不包括營業保證金之孳息。"], ["i", "2. 溢繳營業保證金之退還"], ["p", "經紀業僅得請求退還超過法定應繳存數額之部分，而非全部營業保證金，且不得請求退還孳息。"], ["h", "（五）申請時應檢附之證明文件"], ["i", "1. 原繳存營業保證金之退還"], ["s", "（1）書面理由。"], ["s", "（2）直轄市或縣（市）主管機關核發之核准註銷營業證明文件。"], ["s", "（3）公司或商業登記主管機關核發之公司解散、商號歇業或營業項目變更登記證明文件。"], ["s", "（4）營業保證金繳存證明；如有補繳之繳存證明，應併同檢附。"], ["i", "2. 溢繳營業保證金之退還"], ["s", "（1）書面理由。"], ["s", "（2）經直轄市或縣（市）主管機關就經紀人異動或營業處所裁撤准予備查之證明文件。"], ["s", "（3）營業保證金繳存證明；如有補繳之繳存證明，應併同檢附。"], ["x", "綜上， 本題甲如結束仲介業務，並完成相關註銷程序，得於法定期限內請求退還原繳存之營業保證金；如僅減少經紀人或裁撤營業處所，則須符合繳存金額高於法定數額、備查期間及無受害人請求代為賠償案件等要件，始得請求退還溢繳部分。"]]}, {"n": 5, "title": "預售屋買賣之履約擔保機制", "law": "消保法", "q": ["中央銀行實施選擇性信用管制包含對建商的購地貸款限縮，前陣子有些建商因週轉不靈而倒閉，因而為避免爛尾樓情形，試根據預售屋買賣定型化契約應記載及不得記載事項，說明預售屋有哪些履約擔保機制？"], "a": [["h", "（一）續建"], ["p", "由建商或起造人將建案土地及興建資金信託予金融機構或經政府許可之信託業者，由受託人進行履約管理，並依工程進度控管興建資金，使資金能專款專用，以降低建商任意挪用建案資金之風險。"], ["h", "（二）價金返還之保證"], ["p", "由金融機構提供買方價金返還之保證。若日後發生賣方無法依約完成履約，而符合保證契約所定條件時，由金融機構負擔價金返還之責任，以保障買方已支付之價金。其保證費用由賣方負擔。"], ["h", "（三）價金信託"], ["p", "將買方所繳付之預售屋價金交付信託，由金融機構設立專款專用帳戶，並依信託契約約定，辦理工程款支付、各項稅費繳納及其他資金控管事項，以避免買方所繳價金遭任意挪用。"], ["p", "惟此種信託原則上仍以賣方為受益人，受託人係為賣方管理信託財產，並非直接為買方管理財產；但如賣方未依約定完工或交屋時，受益權則歸屬於買方。"], ["h", "（四）同業連帶擔保"], ["p", "由賣方與其他符合資格之同業同級公司相互提供連帶擔保。若賣方未依約定完工或交屋，買方得持預售屋買賣契約，請求提供擔保之公司接續完成建案並交屋。其中，提供連帶擔保之公司不得拒絕，亦不得另外向買方要求費用或補償。"], ["h", "（五）公會辦理連帶保證協定"], ["p", "係由建商加入全國或各縣市不動產開發商業同業公會所辦理之連帶保證協定。若賣方未依約定完工或交屋，買方得持預售屋買賣契約，請求加入該協定之其他公司共同完成建案並交屋。其中，參與連帶保證協定之公司亦不得向買方提出異議或額外要求費用、補償。"]]}, {"n": 6, "title": "事業結合之申報、審查程序及違反規定之處罰", "law": "公平法", "q": ["近年國內發生數起大型企業併購案件，例如統一集團收購家樂福，以及 Uber Eats 擬併購 foodpanda，兩案經公平交易委員會審查後，卻有不同結果。", "試依公平交易法規定，說明上述案件涉及何種限制競爭行為之管制類型？事業於何種情形應事先申報結合？主管機關之審查程序及判斷標準為何？若未依法申報而逕行結合，應如何處罰？"], "a": [["h", "（一）屬事業結合型態"], ["p", "根據公平交易法規定，事業結合，指事業有下列情形之一者："], ["i", "1. 與他事業合併。"], ["i", "2. 持有或取得他事業之股份或出資額。達到他事業有表決權股份總數或資本總額三分之一以上。"], ["i", "3. 受讓或承租他事業全部或主要部分之營業或財產。"], ["i", "4. 與他事業經常共同經營或受他事業委託經營。"], ["i", "5. 直接或間接控制他事業之業務經營或人事任免。"], ["x", "本題統一集團收購家樂福，以及 Uber Eats擬併購 foodpanda，均涉及取得他事業股份及控制權，符合第2款及第5款之結合型態。"], ["h", "（二）需事前申報情形"], ["i", "1. 事業因結合而使其市場占有率達三分之一。"], ["i", "2. 參與結合之一事業，其市場占有率達四分之一。"], ["i", "3. 參與結合之事業，其上一會計年度銷售金額，超過主管機關所公告之金額。"], ["x", "本題統一集團收購家樂福案，因市場占有率及銷售金額達法定申報門檻，故須事前向公平交易委員會申報。"], ["h", "（三）主管機關辦理程序"], ["i", "1. 事業自主管機關受理其提出完整申報資料之日起算30工作日內，不得為結合。但主管機關認為必要時，得將該期間縮短或延長，並以書面通知申報事業。主管機關延長之期間，不得逾60工作日；對於延長期間之申報案件，應依規定作成決定。"], ["i", "2. 主管機關屆期未為延長通知或決定者，事業得逕行結合。但有下列情形之一者，不得逕行結合："], ["s", "（1）經申報之事業同意再延長期間。"], ["s", "（2）事業之申報事項有虛偽不實。"], ["i", "3. 對於事業結合之申報，如其結合，對整體經濟利益大於限制競爭之不利益者，主管機關不得禁止其結合。"], ["i", "4. 主管機關對於申報案件所為之決定，得附加條件或負擔，以確保整體經濟利益大於限制競爭之不利益。"], ["x", "本題統一併購家樂福案，公平會決議不禁止結合，但附加保障中小型供貨商、限制共同採購等負擔；Uber Eats 併購 foodpanda 案，則因限制競爭之不利益大於整體經濟利益，遭公平會禁止結合。"], ["h", "（四）未申報之處罰"], ["p", "未申報者，主管機關得禁止其結合、限期令其分設事業、處分全部或部分股份、轉讓部分營業、免除擔任職務或為其他必要之處分，並得處新臺幣20萬元以上5,000萬元以下罰鍰。"], ["p", "又事業違反主管機關依規定所為之處分者，得命令解散、勒令歇業或停止營業。"]]}, {"n": 7, "title": "不動產經紀業聯合行為之認定、禁止及例外許可", "law": "公平法", "q": ["近年受房貸政策及市場觀望氣氛影響，部分地區房市交易量低迷，不動產仲介業者面臨經營壓力。數家不動產經紀業者為避免削價競爭，並維持合理營運利潤，遂協議共同訂定一致的服務費收取標準，且足以影響仲介服務供需之市場功能。", "業者主張，此舉只是為因應房市不景氣，應屬合法。", "試依公平交易法規定，說明上述行為之性質、是否合法，以及相關例外許可之情形與規定。"], "a": [["h", "（一）該行為屬聯合行為"], ["p", "指具競爭關係之同一產銷階段事業，以契約、協議或其他方式之合意，共同決定商品或服務之價格、數量、技術、產品、設備、交易對象、交易地區或其相互約束事業活動之行為，而足以影響生產、商品交易或服務供需之市場功能者。"], ["h", "（二）事業不得為聯合行為，即原則採禁止制。"], ["h", "（三）但有下列情形之一，而有益於整體經濟與公共利益，經申請主管機關許可者，不在此限："], ["i", "1. 為降低成本、改良品質或增進效率，而統一商品或服務之規格或型式。"], ["i", "2. 為提高技術、改良品質、降低成本或增進效率，而共同研究開發商品、服務或市場。"], ["i", "3. 為促進事業合理經營，而分別作專業發展。"], ["i", "4. 為確保或促進輸出，而專就國外市場之競爭予以約定。"], ["i", "5. 為加強貿易效能，而就國外商品或服務之輸入採取共同行為。"], ["i", "6. 因經濟不景氣，致同一行業之事業難以繼續維持或生產過剩，為有計畫適應需求而限制產銷數量、設備或價格之共同行為。"], ["i", "7. 為增進中小企業之經營效率，或加強其競爭能力所為之共同行為。"], ["i", "8. 其他為促進產業發展、技術創新或經營效率所必要之共同行為。"], ["p", "因此，本題數家不動產經紀業者共同訂定一致的服務費標準，已構成聯合行為，原則上為公平交易法所禁止。"], ["p", "縱使業者主張係因應房市不景氣，仍須符合前述第6款規定，且有益於整體經濟與公共利益，並經主管機關許可後，始得例外為之，並非僅以市場不景氣即可免責。"]]}, {"n": 8, "title": "商品製造者、經銷者及輸入者之損害賠償責任與免責要件", "law": "消保法", "q": ["甲公司為國外電熱水器製造商，乙公司將該商品輸入臺灣，由丙家電行經銷販售。某建商向丙購買該款電熱水器，安裝於新建房屋內，並委託不動產經紀業者銷售。", "消費者丁購屋入住後，因電熱水器線路設計不良，於正常使用時發生漏電起火事故，造成丁受傷及財物損失。", "甲主張其並無過失，乙主張其僅為輸入者，丙則主張其不知商品具有瑕疵，均否認應負賠償責任。", "試依消費者保護法規定，說明商品製造者、經銷者及輸入者之損害賠償責任與免責要件，並分析甲、乙、丙應否對丁負損害賠償責任。"], "a": [["h", "（一）製造者之責任"], ["i", "1. 從事設計、生產、製造商品或提供服務之企業經營者，於提供商品流通進入市場，或提供服務時，應確保該商品或服務，符合當時科技或專業水準可合理期待之安全性。"], ["i", "2. 商品或服務具有危害消費者生命、身體、健康、財產之可能者，應於明顯處為警告標示及緊急處理危險之方法。"], ["i", "3. 企業經營者違反前二項規定，致生損害於消費者或第三人時，應負連帶賠償責任。但企業經營者能證明其無過失者，法院得減輕其賠償責任。"], ["i", "4. 本題電熱水器因線路設計不良而漏電起火，造成丁受傷及財物損失，如不符合當時科技水準可合理期待之安全性，製造商甲原則上應負損害賠償責任。縱使甲能證明其無過失，法院亦僅得減輕其賠償責任，而非當然免責。"], ["h", "（二）經銷者之責任"], ["i", "1. 從事經銷之企業經營者，就商品或服務所生之損害，與設計、生產、製造商品或提供服務之企業經營者連帶負賠償責任。但其對於損害之防免已盡相當之注意，或縱加以相當之注意而仍不免發生損害者，不在此限。"], ["i", "2. 本題丙家電行為經銷者，原則上應與製造者負連帶賠償責任。丙雖主張不知商品具有瑕疵，但仍須證明其對損害之防免已盡相當注意，或縱加以相當注意仍無法避免損害發生者，始得免責。"], ["h", "（三）輸入者之責任"], ["i", "1. 輸入商品或服務之企業經營者，視為該商品之設計、生產、製造者或服務之提供者，負製造者責任。"], ["i", "2. 本題乙公司雖非實際製造者，但因其將電熱水器輸入臺灣，依法視為製造者，應依（一）規定負損害賠償責任，不得僅以其為輸入者而主張免責。"], ["x", "綜上， 丁得依消費者保護法向製造者甲、輸入者乙及經銷者丙請求連帶損害賠償。其中甲如能證明無過失，法院得減輕其賠償責任；乙視為製造者，負相同責任；丙則須符合已盡相當注意等法定免責要件，始得免責。"]]}, {"n": 9, "title": "定型化契約與定型化契約條款之意義、疑義解釋、無效及不構成契約內容之情形", "law": "消保法", "q": ["何謂定型化契約與定型化契約條款？其契約條款如有疑義時，如何處理？定型化契約條款「無效」及「不構成」之情形為何？"], "a": [["h", "（一）意義"], ["i", "1.定型化契約： 以企業經營者提出之定型化契約條款作為契約內容之全部或一部而訂立之契約。"], ["i", "2.定型化契約條款： 企業經營者為與多數消費者訂立同類契約之用，所提出預先擬定之契約條款。定型化契約條款不限於書面，其以放映字幕、張貼、牌示、網際網路、或其他方法表示者，亦屬之。"], ["h", "（二）定型化契約條款如有疑義時，應為有利於消費者之解釋。"], ["h", "（三）定型化契約條款「無效」情形"], ["i", "1. 定型化契約中之條款違反誠信原則，對消費者顯失公平者，無效。"], ["i", "2. 定型化契約中之定型化契約條款牴觸個別磋商條款之約定者，其牴觸部分無效。"], ["i", "3. 違反中央主管機關公告之定型化契約，其定型化契約條款無效。"], ["i", "4. 企業經營者以定型化契約條款使消費者拋棄審閱權利者，無效。"], ["h", "（四）「不構成」定型化契約條款情形"], ["i", "1. 企業經營者應向消費者明示定型化契約條款之內容；明示其內容顯有困難者，應以顯著之方式公告其內容，並經消費者同意者，該條款即為契約之內容。企業經營者既未明示，亦未以顯著方式公告並經消費者同意者，該條款不構成契約之內容。"], ["i", "2. 定型化契約條款未經記載於定型化契約中而依正常情形顯非消費者所得預見者，該條款不構成契約之內容。"], ["i", "3. 定型化契約條款因字體、印刷或其他情事，致難以注意其存在或辨識者，該條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容。"], ["i", "4. 企業經營者與消費者訂立定型化契約前，應有30日以內之合理期間，供消費者審閱全部條款內容，違反規定者，其條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容。"]]}, {"n": 10, "title": "定型化契約應記載及不得記載事項、契約效力與顯失公平之認定", "law": "消保法", "q": ["甲向乙建商購買預售屋，簽約後發現部分契約條款疑似違反中央主管機關公告之定型化契約規範。", "試問：依消費者保護法規定，定型化契約應記載或不得記載事項，其內容得包括哪些？如契約違反中央主管機關公告之不得記載事項，其效力如何？又條款如何認定顯失公平及違反平等互惠？試說明之。"], "a": [["h", "（一）應記載事項，依契約之性質及目的，其內容得包括："], ["i", "1. 契約之重要權利義務事項。"], ["i", "2. 違反契約之法律效果。"], ["i", "3. 預付型交易之履約擔保。"], ["i", "4. 契約之解除權、終止權及其法律效果。"], ["i", "5. 其他與契約履行有關之事項。"], ["h", "（二）不得記載事項，依契約之性質及目的，其內容得包括："], ["i", "1. 企業經營者保留契約內容或期限之變更權或解釋權。"], ["i", "2. 限制或免除企業經營者之義務或責任。"], ["i", "3. 限制或剝奪消費者行使權利，加重消費者之義務或責任。"], ["i", "4. 其他對消費者顯失公平事項。"], ["h", "（三）違反公告之定型化契約，其定型化契約條款無效；應記載事項未記載者，仍構成契約內容；定型化契約中之定型化契約條款，全部或一部無效或不構成契約內容之一部者，除去該部分，契約亦可成立者，該契約之其他部分，仍為有效。但對當事人之一方顯失公平者，該契約全部無效。"], ["p", "此外，依據消費者保護法，使用定型化契約，違反中央主管機關依規定公告之應記載或不得記載事項者，除法律另有處罰規定外，經主管機關令其限期改正而屆期不改正者，處新臺幣3萬元以上30萬元以下罰鍰；經再次令其限期改正而屆期不改正者，處新臺幣5萬元以上50萬元以下罰鍰，並得按次處罰。"], ["p", "惟本題屬預售屋定型化契約，故應依平均地權條例，銷售預售屋者，使用之契約不符合中央主管機關公告之預售屋買賣定型化契約應記載及不得記載事項，由直轄市、縣（市）主管機關按戶（棟）處新臺幣6萬元以上30萬元以下罰鍰。"], ["h", "（四）定型化契約中之條款有下列情形之一者，推定其顯失公平："], ["i", "1. 違反平等互惠原則者。"], ["i", "2. 條款與其所排除不予適用之任意規定之立法意旨顯相矛盾者。"], ["i", "3. 契約之主要權利或義務，因受條款之限制，致契約之目的難以達成者。"], ["h", "（五）定型化契約條款，有下列情事之一者，為違反平等互惠原則："], ["i", "1. 當事人間之給付與對待給付顯不相當者。"], ["i", "2. 消費者應負擔非其所能控制之危險者。"], ["i", "3. 消費者違約時，應負擔顯不相當之賠償責任者。"], ["i", "4. 其他顯有不利於消費者之情形者。"]]}, {"n": 11, "title": "不動產經紀業廣告不實之法律規定及損害賠償責任", "law": "經紀條例", "q": ["A代銷業之經紀人甲於刊登銷售廣告時，故意誤導該商辦得做住宅用，且部分平面圖規劃不實，致使購屋者乙受到損害，試按不動產經紀業管理條例、公平交易法與消費者保護法，說明其對於廣告不實各有何相關規定，以及其損害賠償之規範？"], "a": [["p", "不動產經紀業廣告指經紀業利用電視、廣播、影片、幻燈片、報紙、雜誌、傳單、海報、招牌、牌坊、廣告圖冊、模型、樣品屋、布條、電腦、電話傳真、電子視訊、電子語音、網際網路或其他方法，使不特定多數人知悉其宣傳內容之傳播。其相關規範如下："], ["h", "（一）不動產經紀業管理條例"], ["i", "1.廣告不實規定"], ["p", "廣告及銷售內容，應與事實相符，並註明經紀業名稱。"], ["i", "2.損害賠償規定"], ["s", "（1）廣告及銷售內容與事實不符者，應負損害賠償責任。"], ["s", "（2）因可歸責於經紀業之事由不能履行委託契約，致委託人受損害時，由該經紀業負賠償責任。"], ["s", "（3）經紀業因經紀人員執行仲介或代銷業務之故意或過失致交易當事人受損害者，該經紀業應與經紀人員負連帶賠償責任。"], ["s", "（4）受害人向中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會請求代為賠償時，視為已向基金管理委員會申請調處，基金管理委員會應即進行調處。"], ["h", "（二）公平交易法"], ["i", "1.廣告不實規定"], ["p", "事業不得在商品或廣告上，或以其他使公眾得知之方法，對於與商品相關而足以影響交易決定之事項，為虛偽不實或引人錯誤之表示或表徵。"], ["i", "2.損害賠償規定"], ["s", "（1）廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與廣告主負連帶損害賠償責任。廣告媒體業在明知或可得而知其所傳播或刊載之廣告有引人錯誤之虞，仍予傳播或刊載，亦與廣告主負連帶損害賠償責任。廣告薦證者明知或可得而知其所從事之薦證有引人錯誤之虞，而仍為薦證者，與廣告主負連帶損害賠償責任。但廣告薦證者非屬知名公眾人物、專業人士或機構，僅於受廣告主報酬10倍之範圍內，與廣告主負連帶損害賠償責任。"], ["s", "（2）事業違反本法之規定，致侵害他人權益者，應負損害賠償責任。法院因被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償。但不得超過已證明損害額之3倍。侵害人如因侵害行為受有利益者，被害人得請求專依該項利益計算損害額。"], ["s", "（3）請求權，自請求權人知有行為及賠償義務人時起，2年間不行使而消滅；自為行為時起，逾10年者亦同。"], ["h", "（三）消費者保護法"], ["i", "1.廣告不實規定"], ["s", "（1）企業經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容。"], ["s", "（2）企業經營者之商品或服務廣告內容，於契約成立後，應確實履行。"], ["i", "2.損害賠償規定"], ["p", "依本法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額5倍以下之懲罰性賠償金；但因重大過失所致之損害，得請求3倍以下之懲罰性賠償金，因過失所致之損害，得請求損害額1倍以下之懲罰性賠償金。"]]}, {"n": 12, "title": "公寓大廈規約、視為規約、應載明事項及不得約定專用部分", "law": "公寓大廈", "q": ["試依公寓大廈管理條例，說明何謂「規約」及「視為規約」？哪些事項非經載明規約者，不生效力？其中，哪些約定專用部分即使記載於規約仍屬無效？"], "a": [["h", "（一）規約之意義"], ["p", "公寓大廈區分所有權人為增進共同利益，確保良好生活環境，經區分所有權人會議決議之共同遵守事項。"], ["h", "（二）視為規約之意義"], ["i", "1.規約草案"], ["p", "公寓大廈之起造人於申請建造執照時，應檢附專有部分、共用部分、約定專用部分、約定共用部分標示之詳細圖說及規約草約。"], ["p", "該規約草約經承受人簽署同意後，於區分所有權人會議訂定規約前，視為規約。"], ["i", "2.中央主管機關之規約範本"], ["p", "公寓大廈管理條例施行前已取得建造執照之公寓大廈，其區分所有權人應依規定，互推一人為召集人，並召開第一次區分所有權人會議，成立管理委員會或推選管理負責人，並向直轄市、縣（市）主管機關報備。"], ["p", "該公寓大廈於區分所有權人會議訂定規約前，以中央主管機關所定規約範本，視為規約。"], ["h", "（三）規約除應載明專有部分及共用部分範圍外，下列各款事項，非經載明於規約者，不生效力："], ["i", "1. 約定專用部分、約定共用部分之範圍及使用主體。"], ["i", "2. 各區分所有權人對建築物共用部分及其基地之使用收益權及住戶對共用部分使用之特別約定。"], ["i", "3. 禁止住戶飼養動物之特別約定。"], ["i", "4. 違反義務之處理方式。"], ["i", "5. 財務運作之監督規定。"], ["i", "6. 區分所有權人會議決議有出席及同意之區分所有權人人數及其區分所有權比例之特別約定。"], ["i", "7. 糾紛之協調程序。"], ["h", "（四）公寓大廈共用部分為下列各款者，不得為約定專用部分："], ["i", "1. 公寓大廈本身所占之地面。"], ["i", "2. 連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳；社區內各巷道、防火巷弄。"], ["i", "3. 公寓大廈基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造。"], ["i", "4. 約定專用有違法令使用限制之規定者。"], ["i", "5. 其他有固定使用方法，並屬區分所有權人生活利用上不可或缺之共用部分。"]]}, {"n": 13, "title": "公寓大廈共用部分之使用、管理委員會職務及違規罰則效力", "law": "公寓大廈", "q": ["甲公寓大廈住戶乙停車時經常超出停車格線，占用共用車道，妨礙其他住戶通行。管理委員會為維護社區停車秩序，決議制定停車場管理辦法，規定違規停車每次扣200點，點數不足時，每點應以現金1元補足。惟社區規約並未載明上述違反義務之處理方式。", "試依公寓大廈管理條例規定，回答下列問題："], "a": [["h", "（一）住戶對公寓大廈共用部分之使用，應遵守哪些規定？違反時應如何處理？"], ["h", "（二）管理委員會對於共用部分之管理維護，有何職務及決議限制？"], ["h", "（三）管理委員會得否僅依其制定之停車場管理辦法，要求住戶繳納前述罰款？"], ["p", "答："], ["h", "（一）共用部分之使用及違反規定之處理"], ["i", "1.共用部分之使用"], ["s", "（1）各區分所有權人按其共有之應有部分比例，對建築物之共用部分及其基地有使用收益之權。但另有約定者從其約定。"], ["s", "（2）住戶對共用部分之使用應依其設置目的及通常使用方法為之。但另有約定者從其約定。"], ["s", "（3）前二項但書所約定事項，不得違反公寓大廈管理條例、區域計畫法、都市計畫法及建築法令之規定。"], ["i", "2.違反規定之處理"], ["p", "住戶違反前述共用部分之使用規定時，管理負責人或管理委員會應予制止，並得按其性質請求各該主管機關或訴請法院為必要之處置。如有損害，並得請求損害賠償。"], ["h", "（二）管理委員會之管理維護職務及決議限制"], ["i", "1.共用部分之管理維護"], ["p", "共用部分、約定共用部分之修繕、管理、維護，由管理負責人或管理委員會為之。"], ["i", "2.管理委員會之職務"], ["s", "（1）區分所有權人會議決議事項之執行。"], ["s", "（2）共有及共用部分之清潔、維護、修繕及一般改良。"], ["s", "（3）公寓大廈及其周圍之安全及環境維護事項。"], ["s", "（4）住戶違規情事之制止及相關資料之提供。"], ["s", "（5）其他依公寓大廈管理條例或規約所定事項。"], ["i", "3.管理委員會決議之限制"], ["p", "管理委員會會議決議之內容不得違反公寓大廈管理條例、規約或區分所有權人會議決議。"], ["h", "（三）管理委員會訂定違規罰則之效力"], ["p", "有關住戶違反義務之處理方式，非經載明於規約者，不生效力。"], ["x", "本案社區規約既未載明扣點及繳納罰款之處理方式，管理委員會不得僅憑自行制定之停車場管理辦法，要求住戶繳納前述罰款。"], ["p", "惟管理委員會仍得依法制止住戶違規使用共用部分之行為，並得按其性質請求主管機關或訴請法院為必要之處置。"]]}, {"n": 14, "title": "住戶之定義、應遵守事項、禁止行為及違反規定之處置", "law": "公寓大廈", "q": ["何謂「住戶」？住戶應遵守之事項有那些？不得有哪些行為？住戶如違反規定該如何處置？試依公寓大廈管理條例規定說明之。"], "a": [["h", "（一）住戶指公寓大廈之區分所有權人、承租人或其他經區分所有權人同意，而為專有部分之使用者或業經取得停車空間建築物所有權者。"], ["h", "（二）住戶應遵守事項"], ["i", "1. 於維護、修繕專有部分、約定專用部分或行使其權利時，不得妨害其他住戶之安寧、安全及衛生。"], ["i", "2. 他住戶因維護、修繕專有部分、約定專用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，不得拒絕。"], ["i", "3. 管理負責人或管理委員會因維護、修繕共用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，不得拒絕。"], ["i", "4. 於維護、修繕專有部分、約定專用部分或設置管線，必須使用共用部分時，應經管理負責人或管理委員會之同意後為之。"], ["i", "5. 其他法令或規約規定事項。"], ["p", "此外，進入或使用，應擇其損害最少之處所及方法為之，並應修復或補償所生損害。"], ["h", "（三）住戶不得有之行為"], ["i", "1. 住戶不得任意棄置垃圾、排放各種污染物、惡臭物質或發生喧囂、振動及其他與此相類之行為。"], ["i", "2. 住戶不得於私設通路、防火間隔、防火巷弄、開放空間、退縮空地、樓梯間、共同走廊、防空避難設備等處所堆置雜物、設置柵欄、門扇或營業使用，或違規設置廣告物或私設路障及停車位侵占巷道妨礙出入。但開放空間及退縮空地，在直轄市、縣（市）政府核准範圍內，得依規約或區分所有權人會議決議供營業使用；防空避難設備，得為原核准範圍之使用；其兼作停車空間使用者，得依法供公共收費停車使用。"], ["i", "3. 住戶為維護、修繕、裝修或其他類似之工作時，未經申請主管建築機關核准，不得破壞或變更建築物之主要構造。"], ["i", "4. 住戶飼養動物，不得妨礙公共衛生、公共安寧及公共安全。但法令或規約另有禁止飼養之規定時，從其規定。"], ["h", "（四）住戶違反規定之處置"], ["i", "1.違反住戶應遵守事項（即前述（二））"], ["s", "（1）住戶違反應遵守事項，經協調仍不履行時，住戶、管理負責人或管理委員會得按其性質請求各該主管機關或訴請法院為必要之處置。"], ["s", "（2）主管機關受理住戶、管理負責人或管理委員會之請求後，經通知限期改善，屆期不改善者，處新臺幣3 千元以上1萬5千元以下罰鍰，並得令其限期改善或履行義務；屆期不改善或不履行者，得連續處罰。"], ["i", "2.違反住戶不得有之行為（即前述（三））"], ["s", "（1）住戶違反時，管理負責人或管理委員會應予制止或按規約處理；經制止而不遵從者，得報請直轄市、縣（市）主管機關處理。"], ["s", "（2）住戶任意棄置垃圾、排放污染物、發生喧囂振動等，或飼養動物妨礙公共衛生、公共安寧及公共安全者，處新臺幣3千元以上1萬5千元以下罰鍰，並得令其限期改善；屆期不改善者，得連續處罰。"], ["s", "（3）住戶於私設通路、防火巷弄、樓梯間、共同走廊等處所堆置雜物、設置柵欄門扇或營業使用，或未經核准破壞、變更建築物主要構造者，處新臺幣4萬元以上20萬元以下罰鍰，並得令其限期改善或履行義務；屆期不改善或不履行者，得連續處罰。"]]}, {"n": 15, "title": "公寓大廈重建方式及不同意重建之區分所有權人處理", "law": "公寓大廈", "q": ["榮耀社區公寓大廈因屋齡老舊、建築物逐漸劣化，部分住戶希望拆除重建，惟所有權人間意見分歧，部分住戶不願配合，致重建計畫難以推動。試依公寓大廈管理條例規定，說明公寓大廈應如何辦理重建？對於不同意重建之區分所有權人，法律上有何處理方式？"], "a": [["h", "（一）公寓大廈重建方式"], ["p", "公寓大廈之重建，應經全體區分所有權人及基地所有權人、地上權人或典權人之同意，但有下列情形之一者，不在此限："], ["i", "1. 配合都市更新計畫而實施重建者。"], ["i", "2. 嚴重毀損、傾頹或朽壞，有危害公共安全之虞者。"], ["i", "3. 因地震、水災、風災、火災或其他重大事變，肇致危害公共安全者。"], ["p", "前述情形得不經全體權利人同意而依法辦理重建。其中，因建築物嚴重毀損或重大災害而重建者，得經區分所有權人會議依法決議辦理；配合都市更新計畫重建者，則應依都市更新相關規定辦理。"], ["h", "（二）區分所有權人不同意重建之處理"], ["i", "1. 公寓大廈有前述第2款或第3款所定情形之一，經區分所有權人會議決議重建時，區分所有權人不同意決議又不出讓區分所有權或同意後不依決議履行其義務者，管理負責人或管理委員會得訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分。"], ["i", "2. 受讓人視為同意重建。"], ["i", "3. 重建之建造執照之申請，其名義以區分所有權人會議之決議為之。"], ["p", "故本題榮耀社區公寓大廈如僅因屋齡老舊、建築物逐漸劣化，尚不足以直接適用上述例外規定。若符合嚴重毀損或重大災害等法定情形，並經區分所有權人會議合法決議重建，始得依法處理不同意重建且拒絕出讓權利之區分所有權人。"]]}, {"n": 16, "title": "公寓大廈區分所有權人會議之決議方式及屋頂設置廣告物之規定", "law": "公寓大廈", "q": ["榮耀社區欲召開區分所有權人會議，討論於公寓大廈屋頂裝設附近某建商預售屋的廣告物，試問該如何達成有效之決議？請依據公寓大廈管理條例規定說明。"], "a": [["p", "區分所有權人會議指區分所有權人為共同事務及涉及權利義務之有關事項，召集全體區分所有權人所舉行之會議。"], ["h", "（一）決議方式"], ["p", "區分所有權人會議，應由召集人於開會前10日以書面載明開會內容，通知各區分所有權人。但有急迫情事須召開臨時會者，得以公告為之；公告期間不得少於2日。"], ["h", "（二）決議方式"], ["i", "1.直接決議"], ["s", "（1）區分所有權人會議之決議，除規約另有規定外，應有區分所有權人三分之二以上及其區分所有權比例合計三分之二以上出席，以出席人數四分之三以上及其區分所有權比例占出席人數區分所有權四分之三以上之同意行之。"], ["s", "（2）區分所有權人會議應作成會議紀錄，載明開會經過及決議事項，由主席簽名，於會後15日內送達各區分所有權人並公告之。"], ["i", "2.決議視為成立"], ["s", "（1）區分所有權人會議依前條規定未獲致決議、出席區分所有權人之人數或其區分所有權比例合計未達前條定額者，召集人得就同一議案重新召集會議；其開議除規約另有規定出席人數外，應有區分所有權人三人並五分之一以上及其區分所有權比例合計五分之一以上出席，以出席人數過半數及其區分所有權比例占出席人數區分所有權合計過半數之同意作成決議。"], ["s", "（2）區分所有權人會議應作成會議紀錄，載明開會經過及決議事項，由主席簽名，於會後15日内送達各區分所有權人並公告之。"], ["s", "（3）決議之會議紀錄依規定送達各區分所有權人後，各區分所有權人得於7日內以書面表示反對意見。書面反對意見未超過全體區分所有權人及其區分所有權比例合計半數時，該決議視為成立。"], ["s", "（4）會議主席應於會議決議成立後10日內，以書面將決議成立結果送達全體區分所有權人並公告之。"], ["h", "（三）另應經過相關人同意之事項"], ["p", "區分所有權人會議之決議，未經依下列各款事項辦理者，不生效力："], ["i", "1. 專有部分經依區分所有權人會議約定為約定共用部分者，應經該專有部分區分所有權人同意。"], ["i", "2. 公寓大廈外牆面、樓頂平臺，設置廣告物、無線電台基地台等類似強波發射設備或其他類似之行為，設置於屋頂者，應經頂層區分所有權人同意；設置其他樓層者，應經該樓層區分所有權人同意。該層住戶，並得參加區分所有權人會議陳述意見。"], ["i", "3. 依規定成立之約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經管理委員會或管理負責人訴請法院判決確定者，不在此限。"], ["p", "因此，榮耀社區欲於公寓大廈屋頂設置廣告物，除應依前述程序及決議門檻作成決議外，並應取得頂層區分所有權人同意，始生效力。"]]}, {"n": 17, "title": "公寓大廈住戶強制遷離及區分所有權人強制出讓之要件與程序", "law": "公寓大廈", "q": ["甲公寓大廈部分住戶長期不遵守社區管理規範，影響其他住戶權益，其中乙為承租人，丙則為區分所有權人。管理委員會認為有必要採取法律措施，以維護社區居住秩序。試依公寓大廈管理條例規定，說明此類情形得採取之法律處理方式、適用要件及相關程序。"], "a": [["h", "（一）住戶之強制遷離"], ["p", "住戶有下列情形之一者，由管理負責人或管理委員會促請其改善，於3個月內仍未改善者，管理負責人或管理委員會得依區分所有權人會議之決議，訴請法院強制其遷離："], ["i", "1.積欠費用"], ["p", "積欠依本條例規定應分擔之費用，經強制執行後再度積欠金額達其區分所有權總價百分之一者。"], ["i", "2.違規受罰仍未改善"], ["p", "違反下列公寓大廈管理條例規定經依規定處以罰鍰後，仍不改善或續犯者："], ["s", "（1）區分所有權人對專有部分之利用，妨害建築物正常使用或違反區分所有權人共同利益。"], ["s", "（2）住戶違反共用部分使用或建築物外牆、樓頂平臺等變更使用限制，經制止而不遵從。"], ["s", "（3）住戶未依使用執照所載用途及規約使用專有或約定專用部分，擅自變更使用。"], ["s", "（4）住戶違規於樓梯間、共同走廊、防火巷等處所堆置雜物、妨礙出入，或擅自破壞、變更建築物主要構造。"], ["i", "3.其他重大違規"], ["p", "其他違反法令或規約情節重大者。"], ["h", "（二）區分所有權人"], ["p", "住戶如為區分所有權人時，管理負責人或管理委員會得依區分所有權人會議之決議，訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分。"], ["p", "於判決確定後3個月內不自行出讓並完成移轉登記手續者，管理負責人或管理委員會得聲請法院拍賣之。"], ["p", "拍賣所得，除其他法律另有規定外，於積欠本條例應分擔之費用，其受償順序與第一順位抵押權同。"], ["h", "（三）本題之適用"], ["x", "本題乙為承租人，若符合前述法定情形及程序，管理委員會得訴請法院強制其遷離；丙為區分所有權人，除適用強制遷離規定外，亦得依法訴請法院命其出讓區分所有權及基地所有權應有部分。"], ["p", "惟不得僅因住戶不遵守社區規範，即逕行要求搬離或強制出讓，仍須符合相關法定要件及程序。"]]}, {"n": 18, "title": "公寓大廈強制成立管理委員會或推選管理負責人之條件、程序及處罰", "law": "公寓大廈", "q": ["老舊公寓大廈有相當多未成立管理委員會或推選管理負責人，試問依照公寓大廈管理條例之規定，有哪些條件下，將被強制要求成立或推選？其程序為何？否則會有何處罰？處罰後仍未依規定成立又該如何處理？"], "a": [["h", "（一）強制成立之條件"], ["p", "公寓大廈管理條例施行前或施行後已取得建造執照之未成立管理委員會或推選管理負責人之公寓大廈，經直轄市、縣（市）主管機關認定有危險之虞者，其區分所有權人應於直轄市、縣（市）主管機關通知後一定期限內成立管理委員會或推選管理負責人，並向直轄市、縣（市）主管機關報備。因故未能於一定期限內成立管理委員會或推選管理負責人並辦理報備者，直轄市、縣（市）主管機關得視實際情況展延一次，並不得超過一年。"], ["p", "此外，依中央主管機關公告，11樓以上之公寓大廈，有下列情形之一者，屬有危險之虞"], ["i", "1. 建築物安全設備：直通樓梯、安全梯、避難層出入口、昇降、避雷或緊急供電設備，任一項檢（複）查不合格。"], ["i", "2. 消防安全設備：滅火、警報、避難逃生、消防搶救必要設備等，任一項檢（複）查不合格。"], ["h", "（二）程序"], ["p", "應於直轄市、縣（市）主管機關通知後一定期限內成立管理委員會或推選管理負責人，並向直轄市、縣（市）主管機關報備。其中，自書面通知最後送達之日起算，報備之期限為2年。"], ["h", "（三）處罰"], ["p", "公寓大廈未依規定於期限內成立管理委員會或推選管理負責人並辦理報備者，由直轄市、縣（市）主管機關按每一專有部分處區分所有權人新臺幣4萬元以上20萬元以下罰鍰，並令其限期辦理；屆期仍未辦理者，得按次處罰。"], ["h", "（四）處罰後仍未成立之處理"], ["p", "公寓大廈區分所有權人經依規定處罰後，仍未依規定成立管理委員會或推選管理負責人並辦理報備者，必要時，由直轄市、縣（市）主管機關指定住戶一人為管理負責人，其任期至成立管理委員會、推選管理負責人或互推召集人為止。"]]}]},
 {id:"land",name:"土地法",laws:["全部","平均地權","登記與租賃","土地徵收","土地稅","房屋・契稅・所得稅"],data:[{"n": 1, "title": "私法人購買住宅之許可及移轉限制", "law": "平均地權", "q": ["甲股份有限公司（以下簡稱甲公司）為私法人，擬購買一戶登記用途為「住宅」之房屋，作為員工宿舍使用。試問甲公司購買該房屋前，是否有應踐行之程序？甲公司辦竣所有權登記後第三年，擬將該房屋出售予乙並辦理所有權移轉登記，是否可行？"], "a": [["p", "為防止私法人藉購買住宅囤房炒作、影響一般民眾之居住權益，平均地權條例管制私法人買受供住宅使用之房屋。以下就本題說明之："], ["h", "（一）甲公司購買房屋前應踐行之程序"], ["i", "1.原則應經許可"], ["p", "依平均地權條例規定，私法人買受供住宅使用之房屋，應檢具使用計畫，經中央主管機關許可。其申請用途應以下列各款之一為限："], ["s", "（1）宿舍。"], ["s", "（2）供居住使用之出租經營。"], ["s", "（3）合建、實施或參與都市更新、都市危險及老舊建築物重建。"], ["s", "（4）建築物使用類組及變更使用辦法規定之衛生福利機構場所。"], ["s", "（5）合作社為設置住宅公用設備。"], ["s", "（6）其他經中央主管機關公告者。"], ["i", "2.例外免經許可"], ["p", "私法人買受住宅之情形，如屬中央主管機關公告免經許可之情形者，不在此限。例如："], ["s", "（1）依法律規定行使優先購買權。"], ["s", "（2）參與法院拍賣。"], ["i", "3.審核方式"], ["p", "中央主管機關為審核許可案件，得遴聘（派）專家學者、民間團體及相關機關代表，以合議制方式辦理之。"], ["i", "4.本題情形"], ["p", "甲公司為私法人，擬買受供住宅使用之房屋，且購買目的為作員工宿舍，不屬中央主管機關公告免經許可之情形，故應檢具使用計畫，經中央主管機關許可，其許可文件有效期限為1年，應於期限內申辦房屋所有權移轉登記。"], ["h", "（二）甲公司登記後第3年原則不得辦理所有權移轉登記"], ["i", "1.5 年内之處分限制"], ["p", "依平均地權條例規定，私法人取得前項房屋後，於登記完畢後5年內，不得辦理移轉、讓與或預告登記。但因強制執行、徵收、法院判決或其他法律規定而移轉或讓與者，不在此限。"], ["i", "2.本題情形"], ["p", "甲公司辦竣所有權登記後僅3年，仍在法定5年限制期間內，其欲基於一般買賣將房屋移轉予乙，又無強制執行、徵收、法院判決或其他法律規定之例外情形，原則上不得辦理該房屋之所有權移轉登記。"]]}, {"n": 2, "title": "預售屋買賣契約讓與之限制及法律效果", "law": "平均地權", "q": ["某甲購買A市之預售屋並已簽訂買賣契約，嗣因經濟困難，無力繼續繳納後續價款，擬將該預售屋買賣契約之權利讓與第三人。試依平均地權條例及相關規定，說明某甲得否轉讓該契約？其例外規定及違反規定之法律效果為何？"], "a": [["h", "（一）原則不得轉讓"], ["p", "依據平均地權條例之規定，預售屋或新建成屋買賣契約之買受人，於簽訂買賣契約後，不得讓與或轉售買賣契約與第三人，並不得自行或委託刊登讓與或轉售廣告。"], ["h", "（二）下列情形例外得轉讓"], ["i", "1.配偶、直系血親或二親等內旁系血親間之讓與或轉售。"], ["i", "2.其他中央主管機關公告得讓與或轉售之情形並經直轄市、縣（市）主管機關核准者。"], ["p", "包含："], ["s", "（1）非自願離職：買受人於簽約繳款後，因非自願離職等法定情事，逾6個月以上未就業，且簽約前已受僱該雇主達1年以上。"], ["s", "（2）重大傷病：買受人於簽約繳款後，本人或其家庭成員罹患重大傷病或特定病症，經專科醫師診斷認定有6個月以上全日照顧需要者。"], ["s", "（3）房屋災損：買受人於簽約繳款後，其本人或家庭成員所有且原設籍居住之房屋，因災害毀損致不堪居住，須另行租屋者。"], ["s", "（4） 重大意外事故：買受人於簽約繳款後，本人或其家庭成員因重大意外事故致第三人死亡或遭受重大傷害，符合公告所定特定病症及醫師診斷認定有6個月以上全日照顧需要等條件者。"], ["s", "（5）買受人死亡：買受人於簽約繳款後死亡，其繼承人讓與或轉售買賣契約，或依法辦理變價分配者。"], ["s", "（6）共同買受人間讓與：買受人為自然人，於簽約繳款後，將契約權利讓與或轉售予契約所列其他共同買受之自然人或法人。"], ["p", "因此，某甲原則不得將預售屋轉讓給第三人，但如符合非自願離職、重大傷病、重大意外事故或房屋災損之情形而繳款困難，經提出相關證明並經核准，則例外可轉讓。惟應注意某甲得讓與或轉售之戶（棟）數，全國每2年以1戶（棟）為限。"], ["h", "（三）處罰"], ["p", "倘若不符合上述情形卻轉讓，則由直轄市、縣（市）主管機關處新臺幣50萬元以上300萬元以下罰鍰；其刊登廣告者，並應令其限期改正或為必要處置；屆期未改正或處置者，按次處罰；其有不動產交易者，按交易戶（棟）處罰。"], ["p", "_______________________________________________________________"]]}, {"n": 3, "title": "預告登記、查封登記與普通抵押權之效果及揭露事項", "law": "登記與租賃", "q": ["甲委託不動產經紀業出售A地，經查詢土地登記謄本，發現該土地除設定抵押權外，另有預告登記及法院查封登記。乙有意購買，並詢問上述登記是否影響土地所有權移轉。試依民法、土地法、土地登記相關規定及不動產說明書應記載及不得記載事項，說明預告登記、查封登記及普通抵押權之意義與法律效果，並說明不動產經紀人員應向乙揭露及解說之重要事項。"], "a": [["h", "（一）預告登記"], ["i", "1.意義： 預告登記係為保全土地權利移轉、消滅、內容或次序變更，以及附條件或期限之請求權所為之登記。"], ["i", "2.法律效果"], ["s", "（1）預告登記未塗銷前，登記名義人就其土地所為之處分，對於所登記之請求權有妨礙者，無效。"], ["s", "（2）預告登記對於因徵收、法院判決或強制執行而為之新登記，無排除之效力。"], ["s", "（3）預告登記之塗銷，原則上應提出原預告登記請求權人之同意書。"], ["h", "（二）查封登記"], ["i", "1.意義： 查封登記係法院或行政執行機關為實施強制執行，限制土地所有權人處分土地權利所為之登記。"], ["i", "2.法律效果"], ["s", "（1）土地經查封登記後，於未塗銷前，登記機關原則上應停止與其權利有關之新登記。"], ["s", "（2）但徵收、區段徵收、照價收買及其他法定例外情形，不在此限。"], ["s", "（3）查封登記原則上應經原囑託登記機關或執行拍賣機關囑託，始得辦理塗銷登記。"], ["h", "（三）普通抵押權"], ["i", "1.意義： 普通抵押權係債權人對於債務人或第三人提供擔保之不動產，不移轉占有，而得就該不動產賣得價金優先受償之擔保物權。"], ["i", "2.法律效果"], ["s", "（1）不動產所有人設定抵押權後，仍得將不動產讓與他人，但抵押權不因此而受影響。"], ["s", "（2）債務屆期未受清償時，抵押權人得依法聲請拍賣抵押物，就賣得價金優先受償。"], ["s", "（3）抵押權具有追及效力，即使抵押物已移轉登記予第三人，抵押權仍繼續存在，抵押權人於債權屆期未受清償時，仍得聲請拍賣該不動產，不因所有權移轉而受影響。"], ["h", "（四）不動產經紀人員之揭露與解說義務"], ["i", "1.權利狀態之揭露"], ["s", "（1）應於不動產說明書記載土地所有權人、權利範圍及交易權利種類與登記狀態。"], ["s", "（2）應揭露抵押權等他項權利之設定情形，以及預告登記、查封登記等限制登記情形。"], ["i", "2.法律效果之解說"], ["s", "（1）預告登記可能限制土地所有權移轉，應確認其保全之請求權及塗銷方式。"], ["s", "（2）查封登記未塗銷前，原則上不得辦理一般買賣之所有權移轉登記，應先確認解除查封之可能性。"], ["s", "（3）抵押權不因買賣而當然消滅，買受人取得所有權後仍可能面臨抵押物遭拍賣之風險，應確認擔保債權及清償、塗銷方式，以保障買方權益。"], ["h", "（五）本題情形"], ["p", "A 地雖設定抵押權，原則上仍得買賣，但其預告登記可能限制所有權移轉，且查封登記未塗銷前，原則上無法辦理一般買賣之移轉登記。因此，經紀人員應向乙充分揭露並解說各項權利限制，確認相關限制得依法排除後，再辦理所有權移轉，以維護交易安全。"], ["p", "__________________________________________________________________"]]}, {"n": 4, "title": "房屋轉租之限制及出租人收回房屋之情形", "law": "登記與租賃", "q": ["甲將其所有之A 市住宅出租予乙居住，租賃期間乙因經濟因素，未經甲書面同意，即將其中一間房間轉租予丙。乙主張民法允許房屋之一部轉租，甲則認為乙違反規定，要求終止租約並收回房屋。試依民法、租賃住宅市場發展及管理條例及土地法之規定，說明房屋轉租之限制及其法律效果，並說明出租人得收回房屋之情形。"], "a": [["h", "（一）民法關於房屋轉租之規定"], ["i", "1.轉租之限制： 承租人非經出租人承諾，不得將租賃物轉租於他人。但租賃物為房屋者，除有反對之約定外，承租人得將其一部分轉租於他人。"], ["i", "2.違法轉租之效果： 承租人違反前述規定，將租賃物轉租於他人者，出租人得終止契約。"], ["i", "3.合法轉租之效力： 承租人合法轉租者，其與出租人間之租賃關係仍為繼續。因次承租人應負責之事由所生之損害，承租人負賠償責任。"], ["h", "（二）租賃住宅市場發展及管理條例之特別規定"], ["i", "1.書面同意： 轉租人應經出租人書面同意，始得轉租其租用住宅之全部或一部。"], ["i", "2.轉租程序： 轉租人簽訂轉租契約時，應向次承租人提供出租人同意轉租之書面文件，並於轉租契約載明相關事項；另應於簽訂轉租契約後30日內，以書面通知出租人。"], ["i", "3.違反效果： 承租人未經出租人書面同意，將租賃住宅轉租於他人者，出租人得提前終止租賃契約，承租人不得要求任何賠償。出租人應於終止前30日，檢附相關事證，以書面通知承租人。"], ["h", "（三）土地法關於出租人收回房屋之情形"], ["p", "出租人非因下列情形之一，不得收回房屋："], ["i", "1. 出租人收回自住或重新建築時。"], ["i", "2. 承租人違反民法第443條第1項規定轉租於他人時。"], ["i", "3. 承租人積欠租金額，除擔保金抵償外，達2個月以上時。"], ["i", "4. 承租人以房屋供違反法令之使用時。"], ["i", "5. 承租人違反租賃契約時。"], ["i", "6. 承租人損壞出租人之房屋或附著財物，而不為相當之賠償時。"], ["h", "（四）本題情形"], ["p", "民法雖原則上容許未有反對約定之房屋一部轉租，但租賃住宅市場發展及管理條例另有特別規定，要求住宅全部或一部轉租均須取得出租人書面同意。因此，乙未經甲書面同意，即將部分住宅轉租予丙，甲得依法提前終止租賃契約，並於租賃關係終止後請求返還房屋。"], ["p", "__________________________________________________________________"]]}, {"n": 5, "title": "耕地租約之終止、補償及協議不成之處理", "law": "平均地權", "q": ["阿昌於40年前將其所有位於非都市土地一般農業區、編定為農牧用地之土地，出租予阿耀耕作，雙方未定租賃期限，租用關係持續至今。嗣該土地依法變更編定為甲種建築用地，阿昌擬收回土地自行興建住宅，但阿耀不同意終止租約，雙方亦無法就補償金額達成協議。試依土地法及平均地權條例之規定，說明：", "（一）耕地出租人得終止耕地租約之情形為何？（二）阿昌得否終止租約？應給予承租人阿耀哪些補償？（三）若雙方協議不成，應如何處理？"], "a": [["p", "耕地租用係以自任耕作（包括漁牧）為目的，約定支付地租，使用他人之農地者，故阿昌與阿耀間為耕地租用關係。"], ["h", "（一）不定期耕地租約之終止情形"], ["i", "1.承租人死亡而無繼承人時。"], ["i", "2.承租人放棄其耕作權利時。"], ["i", "3.出租人收回自耕時。"], ["i", "4.耕地依法變更其使用時。"], ["i", "5.違反民法第432 條（善良管理人注意義務）及第462條第2項（附屬物補充義務）規定時。"], ["i", "6.違反第108條（不得轉租）之規定時。"], ["i", "7.地租積欠達2年之總額時。"], ["p", "另外，本題耕地經依法變更編定為建築用地，屬土地法第114條第4款『耕地依法變更其使用』之情形；另平均地權條例對此亦設有特別規定，即出租耕地經依法編為建築用地者，出租人為收回自行建築或出售作為建築使用時，得終止租約。本題阿昌之土地已依法變更編定為甲種建築用地，且擬收回自行建築住宅，得依法申請終止耕地租約。但實際收回耕地屆滿1年後，不依照使用計畫建築使用者，直轄市或縣（市）政府得照價收買之。"], ["h", "（二）耕地出租人阿昌依規定終止租約收回耕地時，應給予承租人阿耀以下補償："], ["i", "1.改良土地所支付之費用。但依規定以書面通知出租人者為限。"], ["i", "2.尚未收穫之農作改良物。"], ["i", "3.就申請終止租約當期之公告土地現值，預計土地增值稅，並按該公告土地現值減除預計土地增值稅後餘額1/3給予補償。"], ["h", "（三）雙方協議不成之處理程序"], ["i", "1.土地所有權人應以書面向直轄市或縣（市）政府提出終止租約之申請。"], ["i", "2.經主管機關審核，出租人與承租人已達成協議者，應准終止耕地租約。"], ["i", "3.尚未達成協議者，應由主管機關邀集雙方協調。承租人拒不接受協調或對補償金額有爭議時，由主管機關依法定標準計算補償，並通知承租人領取；經領取或依法提存者，准予終止耕地租約。"], ["i", "4.租約終止後，承租人拒不返還耕地者，由直轄市或縣（市）政府移送法院裁定後，強制執行之。"], ["p", "__________________________________________________________________"]]}, {"n": 6, "title": "市地重劃之共同負擔及抵費地處理", "law": "平均地權", "q": ["某市政府為促進都市土地開發利用，選定部分地區辦理市地重劃，重劃區內規劃設置道路、鄰里公園、停車場等公共設施，並須支出相關工程費用及重劃費用。部分土地所有權人對於共同負擔之項目及比例有所疑義，另主管機關於重劃後留設部分抵費地，擬辦理標售或作其他用途。試依平均地權條例及其相關法規之規定，說明市地重劃之共同負擔項目、負擔方法及比例限制，並說明抵費地之處理方式及所得價款應如何運用。"], "a": [["h", "（一）共同負擔項目"], ["i", "1.公共設施用地"], ["p", "重劃區內供公共使用之道路、溝渠、兒童遊樂場、鄰里公園、廣場、綠地、國民小學、國民中學、停車場、零售市場等10 項用地，除以原公有道路、溝渠、河川及未登記地等4項土地抵充外，其不足土地。"], ["i", "2.費用負擔"], ["p", "工程費用、重劃費用及貸款利息。"], ["h", "（二）負擔方法"], ["i", "1.負擔方法"], ["s", "（1）由參加重劃土地所有權人按其土地受益比例共同負擔，並以重劃區內未建築土地折價抵付。所稱折價抵付，指以重劃區內未建築土地按評定重劃後地價折價抵付。"], ["s", "（2）如無未建築土地者，改以現金繳納。"], ["s", "（3）經限期繳納而逾期不繳納者，得移送法院強制執行。"], ["i", "2.比例限制"], ["s", "（1）折價抵付共同負擔之土地，其合計面積以不超過各該重劃區總面積 45%為限。"], ["s", "（2）但經重劃區內私有土地所有權人半數以上，且其所有土地面積超過區內私有土地總面積半數之同意者，不在此限。"], ["h", "（三）抵費地之處理方式"], ["p", "以重劃區內未建築土地，按評定重劃後地價折價抵付共同負擔之土地，稱為抵費地。"], ["i", "1.抵費地之處分"], ["s", "（1）除得按底價讓售為社會住宅用地、公共事業用地或行政院專案核准所需用地外，應訂定底價公開標售、標租或招標設定地上權。"], ["s", "（2）經公開標售而無人得標時，得於不影響重劃區財務計畫之原則下，降低底價再行公開標售，或採標租或招標設定地上權。"], ["i", "2.所得價款運用"], ["s", "（1）抵費地處理所得價款，應優先抵付重劃負擔總費用。"], ["s", "（2）如有盈餘，半數撥充實施平均地權基金，半數作為增添該重劃區公共設施建設、管理、維護之費用。"], ["s", "（3）如有不足，由實施平均地權基金貼補之。"]]}, {"n": 7, "title": "市地重劃後租賃及他項權利之處理與補償", "law": "平均地權", "q": ["某市政府辦理市地重劃，重劃區內部分土地訂有耕地三七五租約或一般土地租約，部分土地則設定有地上權或抵押權。嗣重劃分配結果確定後，部分土地仍能達到原租賃或權利設定之目的，部分則因土地重新分配及使用條件改變，已不能達到原有目的；另有部分出租土地之利用價值發生增減，以及部分土地所有權人未獲分配土地之情形。試依平均地權條例及其施行細則之規定，說明上述租賃及他項權利於重劃後能否達到原目的時，應如何處理？相關權利人又得請求何種補償或權利調整？"], "a": [["h", "（一）重劃後土地及原有權利之效力"], ["i", "1.市地重劃後，重行分配與原土地所有權人之土地，自分配結果確定之日起，視為其原有之土地。但對於行政上或判決上之處分，其效力與原有土地性質上不可分者，不適用之。"], ["i", "2.重劃前土地已設定他項權利而於重劃後分配土地者，主管機關應於辦理土地權利變更登記前，邀集權利人協調，除協調結果該權利消滅者外，應按原登記先後轉載於重劃後分配之土地。"], ["h", "（二）出租耕地之處理"], ["i", "1.能達原租賃目的： 重劃後仍能達到原租賃目的者，原租約繼續存在。"], ["i", "2.不能達原租賃目的： 由直轄市或縣（市）政府逕為註銷其租約並通知當事人，承租人得依下列規定請求或領取補償："], ["s", "（1）重劃後分配土地者，承租人得向出租人請求按重劃計畫書公告當期該土地之公告土地現值1/3之補償。"], ["s", "（2）重劃後未受分配土地者，其應領之補償地價，由出租人領取2/3，承租人領取1/3。"], ["h", "（三）一般出租土地之處理"], ["i", "1.能達原租賃目的： 原租約原則上繼續存在。因重劃而增減其利用價值者，出租人或承租人得向對方請求變更租約及增減相當之租金。"], ["i", "2.不能達原租賃目的： 承租人得終止租約，並得向出租人請求相當1年租金之補償。"], ["h", "（四）地上權之處理"], ["i", "1.能達原設定目的： 原地上權原則上繼續存在，並依規定轉載於重劃後分配之土地。"], ["i", "2.不能達原設定目的： 該地上權視為消滅，地上權人得向土地所有權人請求相當之補償。"], ["h", "（五）抵押權之處理"], ["i", "1.能達原設定目的： 原抵押權原則上繼續存在，並依規定轉載於重劃後分配之土地。"], ["i", "2.不能達原設定目的"], ["s", "（1）該抵押權視為消滅，抵押權人得向土地所有權人請求以其所分配之土地設定抵押權。"], ["s", "（2）未受土地分配者，其原設定抵押權之權利價值，由重劃機關在不超過土地所有權人應得補償之數額內予以協調清理。"], ["h", "（六）請求權行使期間"], ["p", "前述相關請求權，應於重劃分配結果確定之次日起2個月內行使。"]]}, {"n": 8, "title": "土地徵收之一併徵收規定", "law": "土地徵收", "q": ["甲所有相毗鄰之A、B 兩筆土地，長期合併作為同一住宅基地使用，其上建有合法建築改良物一棟。嗣A縣政府為興建道路，徵收A 地之一部分及其上建築改良物之一部分，B地則未列入徵收範圍。試依土地徵收條例說明所涉及一併徵收之規定。"], "a": [["h", "（一）土地改良物之一併徵收"], ["i", "1.徵收土地時，其土地改良物應一併徵收。但有下列情形之一者，不在此限："], ["s", "（1）土地改良物所有權人要求取回，並自公告期滿之日起15日內自行遷移。"], ["s", "（2）墳墓及其他紀念物必須遷移。"], ["s", "（3）建築改良物依法令規定不得建造。"], ["s", "（4）農作改良物之種類或數量與正常種植情形不相當者，其不相當部分。"], ["s", "（5）其他法律另有規定。"], ["i", "2.應徵收之土地改良物，得視其興辦事業計畫之需要，於土地徵收公告之日起3年內徵收之。但土地改良物所有權人於需用土地人報請徵收土地前，請求同時一併徵收其改良物時，需用土地人應同時辦理一併徵收。"], ["h", "（二）殘餘部分之一併徵收"], ["p", "有下列各款情形之一者，所有權人得於徵收公告之日起1年內向該管直轄市或縣（市）主管機關申請一併徵收，逾期不予受理："], ["i", "1.徵收土地之殘餘部分面積過小或形勢不整，致不能為相當之使用者。"], ["i", "2.徵收建築改良物之殘餘部分不能為相當之使用者。"], ["p", "又所謂不能為相當之使用，由直轄市或縣（市）主管機關會同需用土地人、申請人及其他有關機關實地勘查，並作成勘查紀錄；合於規定者，由直轄市或縣（市）主管機關轉需用土地人報請中央主管機關核准之；不合規定者，由直轄市或縣（市）主管機關報請中央主管機關核定後，將處理結果函復申請人。"], ["h", "（三）本題情形"], ["i", "1.土地改良物之一併徵收： A縣政府徵收A地之一部分，其上合法建築改良物位於徵收範圍內之部分，原則上應依規定一併徵收。但有法定例外情形者，不在此限。"], ["i", "2.殘餘土地之一併徵收： 所稱徵收土地之殘餘部分，原指一筆土地部分被徵收，經分割後之賸餘部分。惟若同一所有權人有2筆以上土地，地界相連，實際已合併為同一性質之使用，其中一筆被徵收，賸餘之一筆亦屬殘餘部分。甲所有之A、B 兩筆土地相毗鄰，且原合併作為同一住宅基地使用，故B地雖未直接被徵收，仍可能認定為殘餘土地。倘剩餘土地面積過小或形勢不整，致不能為相當之使用者，甲得依法申請一併徵收。"], ["i", "3.殘餘建築改良物之一併徵收： 原建築改良物之一部分被徵收後，倘其殘餘部分已不能為相當之使用，甲亦得於徵收公告之日起1年內，依法申請一併徵收。"]]}, {"n": 9, "title": "撤銷徵收與廢止徵收之事由、效力及程序", "law": "土地徵收", "q": ["交通部為興建快速道路，經內政部核准徵收相關土地並完成公告及補償程序。嗣後發現，部分土地因作業錯誤而誤列入徵收範圍；另有部分土地因工程變更設計，已不再屬工程所需用地。試依土地徵收條例之規定，說明撤銷徵收與廢止徵收之法定事由及其法律效力有何不同？又撤銷或廢止徵收之辦理程序及土地發還有何規定？"], "a": [["h", "（一）撤銷徵收"], ["p", "已公告徵收之土地，需用土地人應切實按核准計畫及所定期限使用。在未依徵收計畫完成使用前，需用土地人應每年檢討其興辦事業計畫，並由其上級事業主管機關列管。有下列情形之一者，應辦理撤銷徵收："], ["i", "1.因作業錯誤，致原徵收之土地不在工程用地範圍內。"], ["i", "2.公告徵收時，都市計畫已規定以聯合開發、市地重劃或其他方式開發。但以聯合開發方式開發之土地，土地所有權人不願參與聯合開發者，不在此限。"], ["h", "（二）廢止徵收"], ["p", "已公告徵收之土地，有下列情形之一者，應廢止徵收："], ["i", "1.因工程變更設計，致原徵收之土地不在工程用地範圍內。"], ["i", "2.依徵收計畫開始使用前，興辦之事業改變、興辦事業計畫經註銷、開發方式改變或取得方式改變。"], ["i", "3.已依徵收計畫開始使用，尚未依徵收計畫完成使用之土地，因情事變更，致原徵收土地之全部或一部已無徵收之必要。"], ["h", "（三）兩者效力比較"], ["i", "1.撤銷徵收之效力： 撤銷徵收係因原徵收具有法定瑕疵，經撤銷後，原徵收處分原則上溯及既往失其效力。"], ["i", "2.廢止徵收之效力： 廢止徵收係因適法徵收發生情事變更，致原徵收土地已無徵收之必要，經廢止後，原徵收處分原則上向將來失其效力。"], ["h", "（四）辦理程序"], ["i", "1.申請或請求"], ["s", "（1）撤銷或廢止徵收，由需用土地人向中央主管機關申請之。"], ["s", "（2）需用土地人未申請撤銷或廢止徵收者，原土地所有權人得向該管直轄市或縣（市）主管機關請求之。"], ["s", "（3）如該管直轄市或縣（市）主管機關發現已有法定應撤銷或廢止之情形，而需用土地人未申請撤銷或廢止徵收者，由該管直轄市或縣（市）主管機關會同需用土地人及其他有關機關審查後向中央主管機關申請撤銷或廢止徵收。"], ["i", "2.核准並公告"], ["s", "（1）中央主管機關於核准撤銷或廢止徵收後，應將原案通知該管直轄市或縣（市）主管機關。"], ["s", "（2）直轄市或縣（市）主管機關於收到中央主管機關通知核准撤銷或廢止徵收案時，應公告30日"], ["i", "3.通知與徵收價額之繳回"], ["s", "（1）通知原土地所有權人於一定期間繳清應繳納之價額，發還其原有土地。未於一定期間繳清者，不發還其土地，並不得依規定申請收回該土地。一定期間，不得少於6個月。"], ["s", "（2）所稱應繳納之價額，指徵收補償地價、地價加成補償及遷移費。但人口或物件已遷移者，無須繳納遷移費。而徵收補償地價，於徵收前設定有他項權利或耕地租約者，包括他項權利人或耕地承租人原應受領之價金。"], ["s", "（3）撤銷或廢止徵收後，徵收前原設定之他項權利及耕地租約，不予回復。但於區段徵收時，原土地所有權人及他項權利人曾依法申請於發給之抵價地設定抵押權或典權者，其原抵押權或典權准予回復。"]]}, {"n": 10, "title": "區段徵收之實施情形及土地處理方式", "law": "土地徵收", "q": ["A縣政府為辦理新設都市地區之整體開發建設，擬採區段徵收方式取得土地。徵收範圍內除私有土地外，亦包含部分公有土地，經規劃整理後，將配置道路、公園、學校等公共設施用地及其他可供建築土地。部分原土地所有權人希望領回抵價地，並關心開發後土地之處理方式。試依土地徵收條例之規定，說明得實施區段徵收之情形，以及區段徵收範圍內公有土地及規劃整理後土地之處理方式。"], "a": [["p", "區段徵收指於一定區域內之土地，應重新分宗整理，而為全區土地之徵收，其規劃整理後，其處理方式如下："], ["h", "（一）得實施區段徵收之情形"], ["i", "1.新設都市地區之全部或一部，實施開發建設者。"], ["i", "2.舊都市地區為公共安全、衛生、交通之需要或促進土地之合理使用實施更新者。"], ["i", "3.都市土地之農業區、保護區變更為建築用地或工業區變更為住宅區、商業區者。"], ["i", "4.非都市土地實施開發建設者。"], ["i", "5.農村社區為加強公共設施、改善公共衛生之需要或配合農業發展之規劃實施更新者。"], ["i", "6.其他依法得為區段徵收者。"], ["h", "（二）區段徵收範圍內公有土地之處理"], ["i", "1.原則： 區段徵收範圍內之公有土地，管理機關應以作價或領回土地方式撥供該管區段徵收主管機關統籌規劃開發、分配。"], ["i", "2.例外： 區段徵收前已作為道路、溝渠、公園、綠地、兒童遊樂場、廣場、停車場、體育場所及國民學校等9項公共設施用地使用之公有土地，應無償撥供主管機關統籌規劃開發。"], ["i", "3.領回土地： 以領回土地方式提供者，其領回土地面積按區段徵收之抵價地面積比率計算，配回原管理機關，並以法定9項公共設施以外之公共設施用地為優先。"], ["h", "（三）區段徵收範圍土地處理方式"], ["i", "1.抵價地： 發交申請領回抵價地之被徵收土地所有權人領回。抵價地總面積以徵收總面積50%為原則，因情況特殊經上級主管機關核准者，不在此限，但不得少於40%；曾經農地重劃者，該重劃地區部分不得少於45%。"], ["i", "2.法定9項公共設施用地： 道路、溝渠、公園、綠地、兒童遊樂場、廣場、停車場、體育場所及國民學校用地，無償登記為當地直轄市有、縣（市）有或鄉（鎮、市）有。"], ["i", "3.其他公共設施用地： 前款以外之公共設施用地，得由主管機關依財務計畫需要，於徵收計畫書載明有償或無償撥供需地機關，或讓售供公營事業機構使用。"], ["i", "4.特定用途土地： 國民住宅用地、安置原住戶或經行政院專案核准所需土地，得以讓售。"], ["i", "5.其餘可供建築土地： 得予標售、標租或設定地上權。"], ["i", "6.農業專用區： 區段徵收範圍內得規劃配設農業專用區，供原土地所有權人以其已領之現金地價補償費數額申請折算配售土地，作為農業耕作使用。"]]}, {"n": 11, "title": "地價稅特別稅率及公共設施保留地、公有土地之課免", "law": "土地稅", "q": ["A市政府辦理年度地價稅課徵時，部分土地所有權人發現，即使土地地價相近，實際適用之稅率及應納稅額仍可能有所不同，因而向稅捐稽徵機關詢問。試依土地稅法之規定，說明地價稅適用特別稅率之情形，以及公共設施保留地、公有土地之課稅或免徵規定。"], "a": [["h", "（一）自用住宅用地"], ["i", "1.合於下列規定之自用住宅用地，其地價稅按2‰計徵(千分之2) ："], ["s", "（1）戶籍：土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記。"], ["s", "（2）用途：無出租或供營業用之住宅用地。"], ["s", "（3）處數：土地所有權人與其配偶及未成年之受扶養親屬，適用自用住宅用地稅率繳納地價稅者，以1處為限。"], ["s", "（4）面積：都市土地面積未超過3公畝、非都市土地面積未超過7公畝。"], ["s", "（5）申請：土地所有權人申請自用住宅用地特別稅率計徵地價稅時，應填具申請書並檢附建築改良物證明文件，於每年（期）地價稅開徵40日前（即9月22日前）向主管稽徵機關申請核定；逾期申請者，自申請之次年（期）開始適用。前已核定而用途未變更者，以後免再申請。"], ["s", "（6）產權：自用住宅用地，以其土地上之建築改良物屬土地所有權人或其配偶、直系親屬所有者為限。"], ["i", "2.國民住宅及企業或公營事業興建之勞工宿舍，自動工興建或取得土地所有權之日起，其用地之地價稅，適用2‰(千分之2)稅率計徵。"], ["i", "3.依住宅法規定，公益出租人出租房屋之土地，直轄市、縣（市）政府應課徵之地價稅，得按自用住宅用地稅率2‰(千分之2)課徵。"], ["h", "（二）事業直接使用之土地"], ["p", "供下列事業直接使用之土地，按10‰(千分之10)計徵地價稅。但未按目的事業主管機關核定規劃使用者，不適用之："], ["i", "1.工業用地、礦業用地。"], ["i", "2.私立公園、動物園、體育場所用地。"], ["i", "3.寺廟、教堂用地、政府指定之名勝古蹟用地。"], ["i", "4.經主管機關核准設置之加油站及依都市計畫法規定設置之供公眾使用之停車場用地。"], ["i", "5.其他經行政院核定之土地。"], ["p", "前述事業用地適用特別稅率，亦應於每年（期）地價稅開徵40日前提出申請，逾期申請者，自申請之次年（期）開始適用。"], ["h", "（三）都市計畫公共設施保留地"], ["i", "1.在保留期間仍為建築使用者，並作自用住宅用地，即按2‰(千分之2)計徵地價稅"], ["i", "2.在保留期間仍為建築使用者，統按6‰(千分之6)計徵地價稅。"], ["i", "3.其未作任何使用並與使用中之土地隔離者，免徵地價稅。"], ["h", "（四）公有土地"], ["i", "1.公有土地按基本稅率（即10‰(千分之10)不累進）徵收地價稅。"], ["i", "2.但公有土地供公共使用者，免徵地價稅。"]]}, {"n": 12, "title": "自用住宅用地土地增值稅優惠稅率之要件", "law": "土地稅", "q": ["何謂自用住宅用地？自用住宅用地適用土地增值稅優惠稅率之要件為何？又如用過一次後，欲再次適用的要件為何？試說明之。"], "a": [["h", "（一）自用住宅用地指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用之住宅用地。"], ["h", "（二）自用住宅優惠稅率（10%）之要件"], ["i", "1.戶籍： 土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記。"], ["i", "2.用途： 土地於出售前1年內，曾供營業使用或出租者，不適用之。"], ["i", "3.次數： 土地所有權人，依自用住宅稅率繳納土地增值稅者，以1次為限。"], ["i", "4.面積： 都市土地面積未超過3公畝、非都市土地面積未超過7公畝"], ["i", "5.產權： 土地上建築改良物屬土地所有權人或其配偶、直系親屬所有者為限。"], ["i", "6.現值： 自用住宅之評定現值不及所占基地公告土地現值10%者，不適用之。但自用住宅建築工程完成滿1年以上者不在此限。"], ["i", "7.申請： 土地所有權人申請按自用住宅用地稅率課徵土地增值稅，應於土地現值申報書註明自用住宅字樣，並檢附建築改良物證明文件；其未註明者，得於繳納期間屆滿前，向當地稽徵機關補行申請，逾期不得申請依自用住宅用地稅率課徵土地增值稅。"], ["h", "（三）用過一次後，再次適用之要件"], ["p", "土地所有權人適用自用住宅優惠稅率規定後，再出售其自用住宅用地，符合下列各款規定者，不受一次之限制："], ["i", "1.出售都市土地面積未超過1.5公畝部分或非都市土地面積未超過3.5公畝部分。"], ["i", "2.出售時土地所有權人與其配偶及未成年子女，無該自用住宅以外之房屋。"], ["i", "3.出售前持有該土地6年以上。"], ["i", "4.土地所有權人或其配偶、未成年子女於土地出售前，在該地設有戶籍且持有該自用住宅連續滿6年。"], ["i", "5.出售前5年內，無供營業使用或出租。"]]}, {"n": 13, "title": "規定地價程序、申報地價限制及移轉現值審核", "law": "土地稅", "q": ["土地規定地價或重新規定地價，為實施平均地權基本國策的重要基礎，試問依相關規定，主管機關在辦理此項規定地價或重新規定地價時，其作業程序為何？申報地價限制為何？另申報移轉現值之審核標準為何？"], "a": [["h", "（一）直轄市或縣（市）主管機關辦理規定地價或重新規定地價之程序"], ["i", "1.分區調查最近1年之土地買賣價格或收益價格。"], ["i", "2.依據調查結果，劃分地價區段並估計區段地價後，提交地價評議委員會評議。"], ["i", "3.計算宗地單位地價。"], ["i", "4.公告及申報地價，其期限為30日。"], ["i", "5.編造地價冊及總歸戶冊。"], ["h", "（二）申報地價之限制"], ["i", "1.有申報但未於規定額度內： 土地所有權人於公告期間申報地價者，其申報之地價超過公告地價 120%時，以公告地價 120%為其申報地價；申報之地價未滿公告地價80%時，得照價收買或以公告地價80%為其申報地價。"], ["i", "2.未申報： 舉辦規定地價或重新規定地價時，土地所有權人未於公告期間申報地價者，以公告地價80%為其申報地價。"], ["i", "3.免申報： 公有土地及依規定照價收買之土地，以各該宗土地之公告地價為申報地價，免予申報。"], ["h", "（三）申報移轉現值之審核標準"], ["i", "1.認定期日"], ["s", "（1）申報人於訂定契約之日起30日內申報者，以訂約日當期之公告土地現值為準。"], ["s", "（2）申報人逾訂定契約之日起30日始申報者，以受理申報機關收件日當期之公告土地現值為準。"], ["s", "（3）遺贈之土地，以遺贈人死亡日當期之公告土地現值為準。"], ["s", "（4）依法院判決移轉登記者，以申報人向法院起訴日當期之公告土地現值為準。"], ["s", "（5）經法院或法務部行政執行署所屬行政執行分署（以下簡稱行政執行分署）拍賣之土地，以拍定日當期之公告土地現值為準。但拍定價額低於公告土地現值者，以拍定價額為準；拍定價額如已先將設定抵押金額及其他債務予以扣除者，應以併同計算之金額為準。"], ["s", "（6）經政府核定照價收買或協議購買之土地，以政府收買日或購買日當期之公告土地現值為準。但政府給付之地價低於收買日或購買日當期之公告土地現值者，以政府給付之地價為準。"], ["i", "2.申報基準"], ["s", "（1）前第1款至第4款申報人申報之移轉現值，經審核低於公告土地現值者，得由主管機關照其自行申報之移轉現值收買或照公告土地現值徵收土地增值稅。"], ["s", "（2）前第1款至第3款之申報移轉現值，經審核超過公告土地現值者，應以其自行申報之移轉現值為準，徵收土地增值稅。"]]}, {"n": 14, "title": "信託土地不課徵土地增值稅及原地價認定", "law": "土地稅", "q": ["甲以其所有A地成立信託並移轉予受託人乙。試依土地稅法規定回答下列問題：（一）土地為信託財產者，於哪些信託關係人間移轉所有權，不課徵土地增值稅？（二）前述不課徵土地增值稅之信託土地，嗣後於應課徵土地增值稅時，其原地價應如何認定？"], "a": [["h", "（一）信託土地不課徵土地增值稅之情形"], ["p", "土地為信託財產者，有下列信託關係人間移轉所有權之情形，不課徵土地增值稅："], ["i", "1.因信託行為成立，委託人與受託人間之移轉。"], ["i", "2.信託關係存續中受託人變更時，原受託人與新受託人間之移轉。"], ["i", "3.信託契約明定信託財產之受益人為委託人者，於信託關係消滅時，受託人與受益人間之移轉。"], ["i", "4.因遺囑成立之信託，於信託關係消滅時，受託人與受益人間之移轉。"], ["i", "5. 因信託行為不成立、無效、解除或撤銷，委託人與受託人間之移轉。"], ["h", "（二）信託土地原地價之認定"], ["i", "1.一般原則"], ["p", "依前述規定不課徵土地增值稅之土地，嗣後於所有權移轉、設定典權，或依信託法規定轉為受託人自有土地而應課徵土地增值稅時，應以該土地「第一次不課徵土地增值稅前之原規定地價」，或「最近一次課徵土地增值稅時核定之申報移轉現值」為原地價，計算土地漲價總數額。"], ["p", "前述原地價或前次移轉現值，並應依政府發布之物價指數調整後，再計算土地漲價總數額。"], ["i", "2.遺囑信託之特殊規定"], ["p", "因遺囑成立之信託，於成立時以土地為信託財產者，嗣後有應課徵土地增值稅之情形時，以「遺囑人死亡日當期之公告土地現值」為原地價。"], ["i", "3.自益信託受益人死亡之特殊規定"], ["p", "以自有土地交付信託，信託契約明定受益人為委託人並享有全部信託利益，而受益人於信託關係存續中死亡者，嗣後有應課徵土地增值稅之情形時，以「受益人死亡日當期之公告土地現值」為原地價。但委託人藉信託契約不當為他人或自己規避或減少納稅義務者，不適用之。"]]}, {"n": 15, "title": "公共設施保留地及非都市交通用地之稅賦減免", "law": "土地稅", "q": ["甲有一筆都市計畫區範圍內之道路用地尚未被徵收，經查調土地使用分區證明係屬公共設施保留地，請問該土地於甲持有期間之地價稅，或甲移轉時所涉及之土地增值税及房地合一所得稅有何減免規定？又甲於非都市土地另有一筆交通用地，於移轉時是否亦得如同都市公共設施保留地有減免適用？如有，其條件為何？"], "a": [["p", "公共設施保留地係指被劃為公共設施用地，但尚未被有關機關取得者。指定之公共設施保留地，不得為妨礙其指定目的之使用。但得繼續為原來之使用或改為妨礙目的較輕之使用。為兼顧其權益，故甲所有之都市計畫公共設施保留地，其地價稅、土地增值稅、房地合一所得稅有下列減免規定："], ["h", "（一）地價稅"], ["i", "1.在保留期間仍為建築使用者，符合自用住宅用地規定者，稅率為2‰(千分之2)"], ["i", "2.在保留期間仍為建築使用者，除前款外，統按 6‰計徵地價稅。(千分之6)"], ["i", "3.其未作任何使用並與使用中之土地隔離者，免徵地價稅。"], ["h", "（二）土地增值稅"], ["p", "依都市計畫法指定之公共設施保留地尚未被徵收前之移轉，免徵土地增值稅。但經變更為非公共設施保留地後再移轉時，以該土地第一次免徵土地增值稅前之原規定地價或最近一次課徵土地增值稅時核定之申報移轉現值為原地價，計算漲價總數額，課徵土地增值稅。"], ["h", "（三）房地合一所得稅"], ["p", "尚未被徵收前移轉依都市計畫法指定之公共設施保留地，免納所得稅。"], ["h", "（四）非都市土地之交通用地"], ["i", "1.土地增值稅：得免徵。"], ["p", "甲於非都市所有之交通用地得適用免徵之規定。非都市土地經需用土地人開闢完成或依計畫核定供公共設施使用，並依法完成使用地編定，其尚未被徵收前之移轉，經需用土地人證明者，免徵土地增值稅。但經變更為非公共設施使用後再移轉時，以該土地第一次免徵土地增值稅前之原規定地價或最近一次課徵土地增值稅時核定之申報移轉現值為原地價，計算漲價總數額，課徵土地增值稅。"], ["p", "因此，其免徵條件如下："], ["s", "（1）屬依法得徵收。"], ["s", "（2）經需用土地人開闢完成或依計畫核定供公共設施使用。例如：編定時現況已供作公路使用，編定為交通用地，或依核定計畫作學校預定地，編定為特定目的事業用地。"], ["s", "（3）依法完成使用地編定。"], ["s", "（4）經需用土地人證明。亦即申請時，應檢附非都市土地供公共設施使用證明書。"], ["i", "2.房地合一所得稅：不得免納"], ["p", "所得稅法所定公共設施保留地免稅規定，係針對依都市計畫法指定之公共設施保留地，尚未被徵收前之移轉。非都市土地之交通用地不當然適用該項規定；如屬房地合一所得稅課稅範圍，原則上應依法申報，惟仍應確認是否符合被徵收、被徵收前先行協議價購或其他法定免稅情形。"]]}, {"n": 16, "title": "重購土地退還土地增值稅", "law": "土地稅", "q": ["因重購土地申請退還土地增值稅，其申請應備條件、出售與重購地價之認定、退稅額度、重購土地移轉或使用之限制各為何？請依土地稅法規定析述之。"], "a": [["h", "（一）申請應備條件"], ["i", "1.先賣後買"], ["p", "土地所有權人於出售土地後，自完成移轉登記之日起，2年內重購使用性質相同之土地合於下列規定之一："], ["s", "（1）自用住宅用地出售後，另行購買未超過3公畝之都市土地或未超過7公畝之非都市土地仍作自用住宅用地者。但於土地出售前1年內，曾供營業使用或出租者，不適用之。"], ["s", "（2）自營工廠用地出售後，另於其他都市計畫工業區或政府編定之工業用地內購地設廠者"], ["s", "（3）自耕之農業用地出售後另行購買仍供自耕之農業用地者"], ["i", "2.先買後賣"], ["p", "土地所有權人於先購買土地後，自完成移轉登記之日起2年內，始行出售土地者，準用之。"], ["p", "土地所有權人因重購土地，申請依規定退還已納土地增值稅者，應由土地所有權人檢同原出售及重購土地辦理登記時之契約文件影本，向原出售土地所在地稽徵機關辦理。"], ["h", "（二）出售與重購地價之認定"], ["i", "1.原出售土地地價，以該次移轉計徵土地增值稅之地價為準。"], ["i", "2.新購土地地價，以該次移轉計徵土地增值稅之地價為準。"], ["h", "（三）退稅額度"], ["p", "其新購土地地價超過原出售土地地價，扣除繳納土地增值稅後之餘額者，得向主管稽徵機關申請就其已納土地增值稅額內，退還其不足支付新購土地地價之數額。"], ["h", "（四）重購土地移轉或使用之限制"], ["p", "土地所有權人因重購土地退還土地增值稅者，其重購之土地，自完成移轉登記之日起，5年內再行移轉時，除就該次移轉之漲價總數額課徵土地增值稅外，並應追繳原退還稅款；重購之土地，改作其他用途者亦同。其中，改作其他用途包括供營業使用，出租他人及戶籍遷出等情形。其目的係為避免土地所有權人投機轉作其他用途，以逃漏增值稅。"]]}, {"n": 17, "title": "房屋稅新制：自住房屋、按年計徵及申報", "law": "房屋・契稅・所得稅", "q": ["房屋稅新制實施後，對自住房屋之認定及房屋稅課徵方式均有所調整。試依房屋稅條例及相關規定，說明自住房屋適用優惠稅率之條件、按年計徵之意涵，以及新建、增建、改建或拆除房屋之計徵方式。又房屋使用情形變更時，應如何辦理申報？"], "a": [["h", "（一）自住要件"], ["i", "1.一般自住房屋（稅率1.2%）： 所有人或以土地設定地上權之房屋使用權人為個人之住家用房屋，符合下列情形者，適用1.2%稅率："], ["s", "（1）房屋無出租或供營業情形。"], ["s", "（2）供本人、配偶或直系親屬實際居住使用，且應於該屋辦竣戶籍登記。"], ["s", "（3）本人、配偶及未成年子女全國合計3戶以內。"], ["i", "2.全國單一自住房屋（稅率1%）： 除符合前述無出租或供營業，以及實際居住並辦竣戶籍登記之要件外，尚須符合下列條件："], ["s", "（1）本人、配偶及未成年子女於全國僅持有1戶房屋。"], ["s", "（2）房屋現值在房屋所在地直轄市、縣（市）政府所訂一定金額以下。"], ["h", "（二）按年計徵之意涵"], ["i", "1.房屋稅以每年2月之末日為納稅義務基準日，由當地主管稽徵機關按房屋稅籍資料核定。"], ["i", "2.於每年5月1日起至5月31日止一次徵收，其課稅所屬期間為上一年7月1日起至當年6月30日止。"], ["h", "（三）新建、增建、改建與拆除之房屋計徵方式"], ["p", "納稅義務人應於房屋建造完成之日起算30日內，檢附有關文件，向當地主管稽徵機關申報房屋稅籍有關事項及使用情形；增建或改建時，亦同。"], ["i", "1.新建、增建或改建房屋，於當期建造完成者，按月比例計課，未滿1個月者不計；當期拆除者，亦同。"], ["i", "2.每年3月1日起至6月30日止新建、增建或改建完成之房屋，該期間之房屋稅併入次期課徵。"], ["i", "3.上一年7月1日起至當年2月末日止拆除之房屋，其尚未拆除期間之當期房屋稅仍應課徵。"], ["h", "（四）房屋使用情形變更之申報"], ["i", "1.致稅額減少"], ["s", "（1）應於每期開徵40日（即每年3月22日）以前申報；經核定後使用情形未再變更者，以後免再申報。"], ["s", "（2）逾期申報者，自申報之次期開始適用。"], ["i", "2.致稅額增加"], ["s", "（1）應於變更之次期房屋稅開徵40日以前向當地主管稽徵機關申報，自變更之次期開始適用。"], ["s", "（2）逾期申報或未申報者，亦同。"]]}, {"n": 18, "title": "房屋稅減半徵收及免稅要件", "law": "房屋・契稅・所得稅", "q": ["依房屋稅條例之規定，房屋稅之徵收，係以附著於土地之各種房屋及有關增加該房屋使用價值之建築物為對象。茲試問私有房屋有哪些情形，其房屋稅減半徵收？又依規定應申報減半徵收之查定手續為何？又倘若現值在一定金額以下得予免稅之要件為何？"], "a": [["h", "（一）私有房屋有下列情形之一者，其房屋稅減半徵收："], ["i", "1.政府平價配售之平民住宅。"], ["i", "2.合法登記之工廠供直接生產使用之自有房屋。"], ["i", "3.農會所有之自用倉庫及檢驗場，經主管機關證明者。"], ["i", "4.受重大災害，毀損面積佔整棟面積3成以上不及5成之房屋。"], ["h", "（二）依規定減免房屋稅者，應由納稅義務人於每期房屋稅開徵40日以前向當地主管稽徵機關申報；逾期申報者，自申報之次期開始適用。經核定後減免原因未變更者，以後免再申報。"], ["h", "（三）住家用房屋現值在新臺幣十萬元以下屬自然人持有者，全國合計以3戶為限。但房屋標準價格如依規定重行評定時，按該重行評定時之標準價格增減程度調整之。其要件如下："], ["i", "1.住家用房屋。"], ["i", "2.房屋現值在新臺幣10萬元以下。"], ["i", "3.自然人持有。"], ["i", "4.全國合計3戶。"]]}, {"n": 19, "title": "契稅之申報期限及免徵情形", "law": "房屋・契稅・所得稅", "q": ["甲因一般買賣取得房屋，乙則透過法院拍賣取得房屋。另有部分不動產交易涉及興建中建築物之權利移轉，或因特定原因得享有租稅優惠。試依契稅條例之規定，說明契稅之一般申報規定、特殊情形之申報期限及法定免徵契稅之情形。"], "a": [["h", "（一）申報人與一般申報期限"], ["i", "1.納稅義務人應於不動產買賣、承典、交換、贈與及分割契約成立之日起，或因占有而依法申請為所有人之日起30日內，填具契稅申報書表，檢附公定格式契約書及有關文件，向當地主管稽徵機關申報契稅。"], ["i", "2.但未辦建物所有權第一次登記之房屋買賣、交換、贈與、分割，應由雙方當事人共同申報。"], ["h", "（二）特殊情形之申報期限"], ["i", "1.不動產移轉發生糾紛時，其申報契稅之起算日期，應以法院判決確定日為準。"], ["i", "2.向政府機關標購或領買公產，以政府機關核發產權移轉證明書之日為申報起算日。"], ["i", "3.向法院標購拍賣之不動產，以法院發給權利移轉證明書之日為申報起算日。"], ["i", "4.建築物於建造完成前，因買賣、交換、贈與，以承受人為建造執照原始起造人或中途變更起造人名義並取得使用執照者，以主管建築機關核發使用   {id:"cloze", name:"挖空", hint:"所有數字、期限、金額都被挖掉了。先在心裡說出答案，再點空格對答案。"},

  {id:"outline",name:"架構", hint:"申論題先求架構完整。只看大標題與各點關鍵字，試著說出每一點的內容，點開核對。"},
  {id:"recall",name:"默寫", hint:"看題目、不看答案，把能想到的都寫下來，再按「對照答案」檢查關鍵字與數字有沒有漏。草稿會自動保存。"}

function load(k,d){try{const v=localStorage.getItem(pk(k));return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(pk(k),JSON.stringify(v))}catch(e){}}

/* ---------- text helpers ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const NUM = /(?:新臺幣\s*)?\d[\d,，]*(?:\.\d+)?\s*(?:萬元|億元|元|工作日|個月|年|日|天|次|%|％|倍|點|人|萬)?(?:以上|以下|以內)?|[一二三四五六七八九十]+分之[一二三四五六七八九十]+|[一二三四五六七八九十兩]+(?:個月|年|日)(?:以上|以下|以內)?/g;

function numsOf(text){
  const out=[];
  text.replace(NUM,(m,off,str)=>{ if(str[off-1]!=="第") out.push(m.trim()); return m; });
  return out;
}
function markNums(text, mode){
  return esc(text).replace(NUM,(m,off,str)=>{
    if(str[off-1]==="第") return m;
    if(mode==="cloze") return `<button class="blank" data-a="${m}" aria-label="點擊顯示">${m}</button>`;
    return `<mark class="n">${m}</mark>`;
  });
}
function splitLabel(kind,s){
  let m;
  if(kind==="h" && (m=s.match(/^（([一二三四五六七八九十]+)）\s*(.*)$/))) return ["（"+m[1]+"）",m[2]];
  if(kind==="i" && (m=s.match(/^(\d+)\s*[\.、．]\s*(.*)$/))) return [m[1]+".",m[2]];
  if(kind==="s" && (m=s.match(/^[（(](\d+)[）)]\s*(.*)$/))) return ["("+m[1]+")",m[2]];
  return ["",s];
}
function splitKw(body){
  const m = body.match(/^(.{2,16}?)[：:]\s*(.*)$/);
  return m ? [m[1],m[2]] : [null,body];
}
function firstChars(text){
  // keep first 2 chars of each clause; the rest becomes a dotted gap of the same length
  return text.split(/([，。；：、？！「」（）])/).map(seg=>{
    if(!seg || /^[，。；：、？！「」（）]$/.test(seg)) return esc(seg||"");
    const chars=[...seg];
    if(chars.length<=2) return esc(seg);
    return esc(chars.slice(0,2).join(""))+`<span class="hid">${esc(chars.slice(2).join(""))}</span>`;
  }).join("");
}
function normalize(s){
  return s.replace(/新臺幣/g,"").replace(/[\s,，]/g,"")
    .replace(/([一二三四五六七八九]?十?[一二三四五六七八九]?)(?=年|個月|日|次|萬)/g,(m)=>{
      if(!m) return m;
      let v=0; if(m.includes("十")){const [a,b]=m.split("十"); v=(a?CN.indexOf(a)+1:1)*10+(b?CN.indexOf(b)+1:0);} else v=CN.indexOf(m)+1;
      return v>0?String(v):m;
    }).replace(/兩(?=年|個月)/g,"2");
}

/* ---------- rendering ---------- */
function renderLine(kind,s,mode){
  const [lab,body0]=splitLabel(kind,s);
  const labH = lab?`<span class="lab">${lab}</span>`:"";
  if(kind==="h"){
    return `<div class="ln h">${lab}${mode==="cloze"||mode==="read"?markNums(body0,mode):esc(body0)}</div>`;
  }
  const [kw,rest]=splitKw(body0);
  const cls = "ln "+kind;
  if(mode==="read"||mode==="cloze"){
    const inner=(kw?`<span class="kw">${markNums(kw,mode)}：</span>`:"")+markNums(rest,mode);
    return `<div class="${cls}">${labH}<div>${inner}</div></div>`;
  }
  if(mode==="first"){
    const inner=(kw?`<span class="kw">${firstChars(kw)}：</span>`:"")+firstChars(rest);
    return `<div class="${cls} tap" tabindex="0">${labH}<div>${inner}</div></div>`;
  }
  if(mode==="outline"){
    if(kind==="i"||kind==="s"){
      const ch=[...rest];
      const head = kw?`<span class="kw">${esc(kw)}</span>`:`<span class="kw">${esc(ch.slice(0,4).join(""))}</span>`;
      const full = kw?`<span class="full">：${markNums(rest,"read")}</span><span class="fold" style="margin-left:.5em">內容</span>`
                     :`<span class="full">${markNums(ch.slice(4).join(""),"read")}</span><span class="fold" style="margin-left:.3em">⋯</span>`;
      return `<div class="${cls} tap" tabindex="0">${labH}<div>${head}${full}</div></div>`;
    }
    const tag = kind==="x"?"涵攝":"說明段落";
    return `<div class="ln sk-p tap" tabindex="0"><span class="fold">${tag}・${[...body0].length} 字</span><span class="full">${markNums(body0,"read")}</span></div>`;
  }
  return "";
}

function keysOf(t){
  const keys=new Set();
  t.a.forEach(([k,s])=>{
    numsOf(s).forEach(n=>keys.add(n.replace(/^新臺幣\s*/,"")));
    if(k==="i"||k==="s"){const [,b]=splitLabel(k,s);const [kw]=splitKw(b); if(kw&&kw.length<=10) keys.add(kw);}
  });
  return [...keys];
}

function render(){
  const t=DATA[S.idx];
  const mode=S.mode;
  const m=MODES.find(x=>x.id===mode);
  let h=`<p class="hint">${m.hint}</p>
  <div class="qhead"><div class="qno">${String(t.n).padStart(2,"0")}</div><div class="law">${t.law}</div></div>
  <h1 class="title">${esc(t.title)}</h1>`;
  const qHtml=t.q.map(p=>`<p>${esc(p)}</p>`).join("");
  if(mode==="read") h+=`<details class="question"><summary>題目</summary>${qHtml}</details>`;
  else h+=`<div class="question">${qHtml}</div>`;

  if(mode==="recall"){
    const draft=load("draft_"+t.n,"");
    h+=`<textarea id="draft" placeholder="在這裡默寫答案…">${esc(draft)}</textarea>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" id="checkBtn">對照答案</button><button class="btn" id="clearBtn">清空重寫</button></div>
    <div id="result"></div>`;
  } else {
    h+=`<div class="answer" id="answer">${t.a.map(([k,s])=>renderLine(k,s,mode)).join("")}</div>`;
  }
  const cur=S.mastery[t.n]||"";
  h+=`<div class="rate"><span>這題背得如何？</span>
    <button class="btn bad" data-r="bad" aria-pressed="${cur==="bad"}">還不熟</button>
    <button class="btn mid" data-r="mid" aria-pressed="${cur==="mid"}">大致記得</button>
    <button class="btn good" data-r="good" aria-pressed="${cur==="good"}">背熟了</button></div>`;
  document.getElementById("sheet").innerHTML=h;
  updateBottom();

  document.getElementById("revealBtn").style.display = (mode==="read"||mode==="recall")?"none":"";
  document.getElementById("revealBtn").textContent="全部顯示";
  bindSheet();
  renderList(); renderModes();
}

function bindSheet(){
  const sheet=document.getElementById("sheet");
  sheet.querySelectorAll(".blank").forEach(b=>b.onclick=()=>b.classList.toggle("on"));
  sheet.querySelectorAll(".tap").forEach(l=>{
    const f=()=>l.classList.toggle("open");
    l.onclick=e=>{ if(window.getSelection().toString()) return; f(); };
    l.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();f();} };
  });
  sheet.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
    const t=DATA[S.idx]; const r=b.dataset.r;
    if(S.mastery[t.n]===r) delete S.mastery[t.n]; else S.mastery[t.n]=r;
    save("mastery",S.mastery); render();
  });
  sheet.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  const ta=document.getElementById("draft");
  if(ta){
    const t=DATA[S.idx];
    ta.oninput=()=>save("draft_"+t.n,ta.value);
    document.getElementById("clearBtn").onclick=()=>{ta.value="";save("draft_"+t.n,"");document.getElementById("result").innerHTML="";ta.focus();};
    document.getElementById("checkBtn").onclick=()=>{
      const mine=normalize(ta.value);
      const keys=keysOf(t);
      const res=keys.map(k=>({k,hit:mine.includes(normalize(k))}));
      const hit=res.filter(r=>r.hit).length;
      document.getElementById("result").innerHTML=`<div class="score"><div>關鍵字與數字命中 <b>${hit}</b> / ${keys.length}</div>
        <div class="keys">${res.map(r=>`<span class="key ${r.hit?"hit":"miss"}">${r.hit?"✓":"✗"} ${esc(r.k)}</span>`).join("")}</div></div>
        <div class="answer">${t.a.map(([k,s])=>renderLine(k,s,"read")).join("")}</div>`;
      document.getElementById("result").scrollIntoView({behavior:"smooth",block:"start"});
    };
  }
}

function renderModes(){
  document.getElementById("modes").innerHTML=MODES.map(m=>`<button data-m="${m.id}" aria-pressed="${S.mode===m.id}">${m.name}</button>`).join("");
  document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{stopTTS();S.mode=b.dataset.m;save("mode",S.mode);render();window.scrollTo({top:0});});
}

function renderList(){
  const sj=document.getElementById("subj");
  sj.innerHTML=BOOKS.map(b=>`<button role="tab" data-b="${b.id}" aria-selected="${BK.id===b.id}">${b.name}</button>`).join("");
  sj.querySelectorAll("button").forEach(b=>b.onclick=()=>switchBook(b.dataset.b));
  const f=document.getElementById("filters");
  f.innerHTML=LAWS.map(l=>`<button class="chip" data-l="${l}" aria-pressed="${S.law===l}">${l}</button>`).join("");
  f.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{S.law=c.dataset.l;renderList();});
  let html="";
  LAWS.slice(1).forEach(law=>{
    if(S.law!=="全部"&&law!==S.law) return;
    html+=`<div class="group">${law}</div>`;
    DATA.forEach((t,i)=>{
      if(t.law!==law) return;
      html+=`<button class="topic" data-i="${i}" aria-current="${i===S.idx}"><span class="no">${t.n}</span><span>${esc(t.title)}</span><span class="dot ${S.mastery[t.n]||""}"></span></button>`;
    });
  });
  const list=document.getElementById("list"); list.innerHTML=html;
  list.querySelectorAll(".topic").forEach(b=>b.onclick=()=>{go(+b.dataset.i);closeRail();});
  const c={good:0,mid:0,bad:0}; Object.values(S.mastery).forEach(v=>c[v]++);
  const N=DATA.length;
  document.getElementById("progText").textContent=`背熟 ${c.good} ・大致 ${c.mid} ・不熟 ${c.bad} ・未評 ${N-c.good-c.mid-c.bad}（共 ${N} 題）`;
  document.getElementById("progBar").innerHTML=`<i style="width:${c.good/N*100}%;background:var(--ok)"></i><i style="width:${c.mid/N*100}%;background:var(--mid)"></i><i style="width:${c.bad/N*100}%;background:var(--bad)"></i>`;
}

function go(i){
  if(i<0||i>=DATA.length) return;
  stopTTS();
  S.idx=i;
  const hs=(BK.id==="jj"?"#q":"#"+BK.id+"-q")+DATA[i].n;
  if(location.hash!==hs){try{history.replaceState(null,"",hs);}catch(e){}}
  render(); window.scrollTo({top:0});
}
function switchBook(id){
  if(id===BK.id) return;
  stopTTS(); setBook(id); save("book",id);
  S.mastery=load("mastery",{}); S.law="全部";
  go(0);
}
function fromHash(){
  const m=location.hash.match(/^#(?:(land)-)?q(\d+)$/);
  if(m){const id=m[1]||"jj"; if(id!==BK.id){setBook(id);S.mastery=load("mastery",{});S.law="全部";save("book",id);} m[1]=m[2];const i=DATA.findIndex(t=>t.n===+m[1]); if(i>=0){S.idx=i;return true;}}
  return false;
}

/* ---------- reveal all ---------- */
document.getElementById("revealBtn").onclick=e=>{
  const showing=e.target.textContent==="全部顯示";
  document.querySelectorAll("#answer .blank").forEach(b=>b.classList.toggle("on",showing));
  document.querySelectorAll("#answer .tap").forEach(l=>l.classList.toggle("open",showing));
  e.target.textContent=showing?"全部遮住":"全部顯示";
};

/* ---------- font size / theme ---------- */
function setFs(v){S.fs=Math.max(14,Math.min(26,v));document.documentElement.style.setProperty("--fs",S.fs+"px");save("fs",S.fs);}
document.getElementById("fsUp").onclick=()=>setFs(S.fs+1);
document.getElementById("fsDown").onclick=()=>setFs(S.fs-1);
document.getElementById("themeBtn").onclick=()=>{
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  S.theme = dark?"light":"dark"; document.documentElement.dataset.theme=S.theme; save("theme",S.theme);
};

/* ---------- random ---------- */
function updateBottom(){
  const N=DATA.length;
  document.getElementById("bbPrev").disabled=S.idx<=0;
  document.getElementById("bbNext").disabled=S.idx>=N-1;
  document.getElementById("bbFill").style.width=((S.idx+1)/N*100)+"%";
  document.getElementById("bbCount").textContent=`${S.idx+1} / ${N}`;
  const tr=document.getElementById("bbTrack");
  tr.setAttribute("aria-valuemax",N);tr.setAttribute("aria-valuenow",S.idx+1);
}
document.getElementById("bbPrev").onclick=()=>go(S.idx-1);
document.getElementById("bbNext").onclick=()=>go(S.idx+1);
document.getElementById("bbTrack").onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  go(Math.min(DATA.length-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*DATA.length))));
};
function randomPick(){
  let pool=DATA.map((t,i)=>i).filter(i=>S.mastery[DATA[i].n]!=="good"&&i!==S.idx);
  if(!pool.length) pool=DATA.map((t,i)=>i).filter(i=>i!==S.idx);
  // weight: 不熟 ×3, 未評 ×2, 大致 ×1
  const w=pool.flatMap(i=>{const r=S.mastery[DATA[i].n];return Array(r==="bad"?3:r==="mid"?1:2).fill(i);});
  go(w[Math.floor(Math.random()*w.length)]); closeRail();
}
document.getElementById("randBtn").onclick=randomPick;
document.getElementById("bbRand").onclick=randomPick;

/* ---------- drawer ---------- */
const rail=document.getElementById("rail"), scrim=document.getElementById("scrim");
function closeRail(){rail.classList.remove("open");scrim.classList.remove("open");}
document.getElementById("menuBtn").onclick=()=>{rail.classList.add("open");scrim.classList.add("open");};
scrim.onclick=closeRail;

/* ---------- TTS ---------- */
let ttsOn=false, ttsI=0;
const ttsBtn=document.getElementById("ttsBtn");
if(!("speechSynthesis" in window)){ttsBtn.style.display="none";document.getElementById("rate").style.display="none";}
function pickVoice(){
  if(!("speechSynthesis" in window)) return null;
  const vs=speechSynthesis.getVoices();
  return vs.find(v=>/HsiaoChen/i.test(v.name))||vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;
}
if("speechSynthesis" in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}
function speakNext(){
  const lines=[...document.querySelectorAll("#answer .ln")];
  document.querySelectorAll(".ln.speaking").forEach(l=>l.classList.remove("speaking"));
  if(!ttsOn||ttsI>=lines.length){stopTTS();return;}
  const el=lines[ttsI];
  const text=DATA[S.idx].a[ttsI][1];
  el.classList.add("speaking"); el.scrollIntoView({block:"center",behavior:"smooth"});
  const u=new SpeechSynthesisUtterance(text);
  u.lang="zh-TW"; u.rate=+document.getElementById("rate").value;
  const v=pickVoice(); if(v){u.voice=v;u.lang=v.lang;}
  u.onend=()=>{ttsI++;speakNext();};
  speechSynthesis.speak(u);
}
function stopTTS(){ttsOn=false;try{speechSynthesis.cancel()}catch(e){};ttsBtn.textContent="▶ 朗讀";document.querySelectorAll(".ln.speaking").forEach(l=>l.classList.remove("speaking"));}
ttsBtn.onclick=()=>{
  if(ttsOn){stopTTS();return;}
  if(S.mode==="recall"){S.mode="read";save("mode",S.mode);render();}
  ttsOn=true;ttsI=0;ttsBtn.textContent="■ 停止";speechSynthesis.cancel();speakNext();
};

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT") return;
  if(e.key==="ArrowRight") go(S.idx+1);
  if(e.key==="ArrowLeft") go(S.idx-1);
});
window.addEventListener("hashchange",()=>{if(fromHash()){stopTTS();render();}});

if(!MODES.some(m=>m.id===S.mode)) S.mode="read";
fromHash();
render();
</script>
</body>
